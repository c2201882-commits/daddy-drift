<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<!-- Without this, mobile browsers render at a virtual desktop-width
     viewport (~980px) and scale the whole page down to fit, which is why
     everything looked tiny on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>爹地漂流記</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
  #topRightBar {
    position: fixed; top: 10px; right: 10px; z-index: 10; display: none;
    align-items: flex-start; gap: 8px;
  }
  #helpBtn {
    width: 30px; height: 30px; border-radius: 50%; border: none; flex-shrink: 0;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer; line-height: 30px; padding: 0;
  }
  #helpPanel {
    position: fixed; top: 48px; right: 10px; z-index: 12; display: none;
    color: #fff; background: rgba(0,0,0,0.8);
    padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.6;
    max-width: 220px;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; background: #222; z-index: 20;
  }
  #questPanel {
    position: fixed; top: 10px; left: 10px; z-index: 10; display: none;
    background: rgba(0,0,0,0.55); color: #fff; border-radius: 10px; padding: 10px 14px;
    min-width: 180px; font-size: 13px;

  .quest-row {
    padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; line-height: 1.4;

  .quest-row.quest-available { background: rgba(255,213,74,0.18); cursor: pointer; }
  .quest-row.quest-available:hover { background: rgba(255,213,74,0.32); }
  .quest-row.quest-active { background: rgba(80,160,255,0.22); }
  .quest-row.quest-completed { opacity: 0.55; text-decoration: line-through; }
  .quest-row .quest-hint { display: block; font-size: 11px; opacity: 0.75; margin-top: 2px; }
  #questArrow {

  #hpRow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

  #moneyRow { display: flex; align-items: center; gap: 6px; }

  #joystickBase {

  #mcActions {

  .mc-wide {

  #zoomSliderWrap {

  #startScreen {

  #startScreen h1 { color: #fff; font-size: 32px; margin: 0; letter-spacing: 4px; }
  #startBtn {

  #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9a530; }
  #startBtn:disabled { opacity: 0.6; cursor: default; }
  #dialogBox {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    z-index: 25; display: none; background: rgba(20, 20, 30, 0.92); color: #fff;

  #foundOverlay .card {

  #moneyDialog {

    font-size: 20px; text-align: center;
  }
  #healingBanner {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);

    padding: 16px 32px; border-radius: 12px; border: 2px solid #7CFC9A;

  #hellBanner {

  #questIntroDialog {

    max-width: 480px; width: 86%; text-align: center;

  #questIntroDialog h3 { margin: 0 0 8px 0; font-size: 18px; }
  #questIntroDialog p { margin: 0 0 16px 0; line-height: 1.6; font-size: 15px; }
  #questPortraitRow { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 10px; }
  #questPortrait, #questPortrait2 { display: none; border-radius: 50%; background: #2a3a55; }
  #questHintBox { display: none; margin: 0 0 14px 0; }
  #questHintBox .label { font-size: 11px; opacity: 0.75; margin-bottom: 4px; }

  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
// Starts high above the whole map for the opening cinematic (see the
// game-state machine near the bottom); swaps to a normal follow cam once
// gameplay begins.
camera.position.set(0, 260, 0.01);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- Lights ---
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(10, 20, 10);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -30;
dir.shadow.camera.right = 30;
dir.shadow.camera.top = 30;
dir.shadow.camera.bottom = -30;
scene.add(dir);

// --- Ground (grass beyond the city block) ---
const groundGeo = new THREE.PlaneGeometry(480, 480);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x5b8a4a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// --- City block: road + sidewalks ---
const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
const CITY_SIZE = 140; // half-width of the paved city block

const road = new THREE.Mesh(new THREE.PlaneGeometry(CITY_SIZE * 2, CITY_SIZE * 2), roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0;
road.receiveShadow = true;
scene.add(road);

// Lane markings down the middle of the two main streets
const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x222222 });
for (let i = -CITY_SIZE; i < CITY_SIZE; i += 4) {
  const lineH = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.3), lineMat);
  lineH.rotation.x = -Math.PI / 2;
  lineH.position.set(i + 1, 0.01, 0);
  scene.add(lineH);
  const lineV = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), lineMat);
  lineV.rotation.x = -Math.PI / 2;
  lineV.position.set(0, 0.01, i + 1);
  scene.add(lineV);
}

// Sidewalks bordering each city block (4 quadrants split by the cross streets)
const STREET_HALF_WIDTH = 5;
const sidewalkThickness = 0.15;

// Native building models are only ~2-4 units tall (they're single-storey
// Kenney kit pieces, ~2x2 footprint). Scaled up so buildings tower over the
// 1.8m-tall character instead of being roughly the same size.
const BUILDING_SCALE = 6;
const SKYSCRAPER_SCALE = 9;
const BUILDING_HALF_FOOTPRINT = BUILDING_SCALE;      // ~6
const SKYSCRAPER_HALF_FOOTPRINT = SKYSCRAPER_SCALE;  // ~9

// Buildings sit close to the road, leaving only a slim sidewalk strip
// between the curb and the building fronts (instead of a deep plaza).
const ROW_SETBACK = STREET_HALF_WIDTH + 3 + SKYSCRAPER_HALF_FOOTPRINT; // distance from street centerline to each row's baseline
const ROWS_PER_SIDE = 8; // buildings packed side by side along each sidewalk edge — as many as fit
// How far the paved sidewalk extends past the curb — just enough to cover
// the building fronts, not a step further. Everything past this is grass,
// and a matching invisible wall (see below) stops the player from walking
// out into that open space around the ends of a building row.
const SIDEWALK_DEPTH = (ROW_SETBACK + SKYSCRAPER_HALF_FOOTPRINT + 3) - STREET_HALF_WIDTH;

function addSidewalkBlock(x, z, w, d) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, sidewalkThickness, d), sidewalkMat);
  mesh.position.set(x, sidewalkThickness / 2, z);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  scene.add(mesh);
  return mesh;
}
// Each quadrant gets an L-shaped sidewalk (one strip facing each of the two
// streets) instead of one giant square slab — this hugs just the buildings
// and the road, leaving no vast open plaza behind the building rows.
const rowLength = CITY_SIZE - STREET_HALF_WIDTH;
[-1, 1].forEach((sx) => {
  [-1, 1].forEach((sz) => {
    // strip facing the horizontal (X) street: long in X, shallow in Z
    addSidewalkBlock(
      sx * (STREET_HALF_WIDTH + rowLength / 2),
      sz * (STREET_HALF_WIDTH + SIDEWALK_DEPTH / 2),
      rowLength, SIDEWALK_DEPTH
    );
    // strip facing the vertical (Z) street: shallow in X, long in Z
    addSidewalkBlock(
      sx * (STREET_HALF_WIDTH + SIDEWALK_DEPTH / 2),
      sz * (STREET_HALF_WIDTH + rowLength / 2),
      SIDEWALK_DEPTH, rowLength
    );
  });
});

// --- Buildings loaded from the Kenney "City Kit (Commercial)" pack (CC0) ---
const BUILDING_FILES = [
  'building-a.glb', 'building-b.glb', 'building-c.glb', 'building-d.glb',
  'building-e.glb', 'building-f.glb', 'building-g.glb', 'building-h.glb',
  'building-i.glb', 'building-j.glb', 'building-k.glb', 'building-l.glb',
  'building-skyscraper-a.glb', 'building-skyscraper-b.glb',
  'building-skyscraper-c.glb', 'building-skyscraper-d.glb',
];
const cityLoader = new GLTFLoader();
const buildingCache = {};
const colliders = []; // { minX, maxX, minZ, maxZ } world-space AABBs the player can't walk through

const MODEL_SUBDIR = { city: 'GLB format', nature: 'GLTF format' };
function loadBuildingModel(file, dir = 'city') {
  const key = dir + '/' + file;
  if (buildingCache[key]) return buildingCache[key];
  const p = new Promise((resolve) => {
    cityLoader.load(
      `./assets/${dir}/Models/${MODEL_SUBDIR[dir]}/${file}`,
      (gltf) => resolve(gltf.scene),
      undefined,
      () => resolve(null)
    );
  });
  buildingCache[key] = p;
  return p;
}

async function placeBuilding(file, x, z, rotationY, scale) {
  const template = await loadBuildingModel(file);
  if (!template) return;
  const instance = template.clone(true);
  instance.traverse((obj) => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });
  instance.rotation.y = rotationY;
  instance.scale.setScalar(scale);
  instance.position.set(x, 0, z);
  scene.add(instance);

  const box = new THREE.Box3().setFromObject(instance);
  const margin = 0.3; // slight buffer so the player doesn't clip corners
  colliders.push({
    minX: box.min.x + margin, maxX: box.max.x - margin,
    minZ: box.min.z + margin, maxZ: box.max.z - margin,
  });
  return box;
}

// --- Trees & benches (Kenney "Nature Kit", CC0, + a simple procedural bench) ---
const TREE_FILES = ['tree_oak.glb', 'tree_pineTallA.glb', 'tree_detailed.glb', 'tree_fat.glb'];
const TREE_SCALE = 2.2;

function makeBench() {
  const group = new THREE.Group();
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.5), woodMat);
  seat.position.y = 0.45;
  const back = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.08), woodMat);
  back.position.set(0, 0.7, -0.21);
  group.add(seat, back);
  [-0.6, 0.6].forEach((lx) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.45, 0.45), metalMat);
    leg.position.set(lx, 0.22, 0);
    group.add(leg);
  });
  group.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
  return group;
}

async function placeTree(file, x, z, scale = TREE_SCALE) {
  const template = await loadBuildingModel(file, 'nature');
  if (!template) return;
  const instance = template.clone(true);
  instance.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
  instance.scale.setScalar(scale);
  instance.position.set(x, 0, z);
  instance.rotation.y = Math.random() * Math.PI * 2;
  scene.add(instance);
}

// --- Map boundary: a ring of trees (near) and low-poly mountains (far)
// around the whole paved city, so walking to the edge finds a natural-
// looking wall instead of open grass fading into nothing. Backed by
// invisible colliders so the player can't walk past the ring at all.
function makeMountain(height, radius, color) {
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(radius, height, 7),
    new THREE.MeshStandardMaterial({ color, flatShading: true })
  );
  mesh.position.y = height / 2;
  mesh.rotation.y = Math.random() * Math.PI * 2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function placeMountain(x, z) {
  const height = 22 + Math.random() * 38;
  const radius = height * (0.5 + Math.random() * 0.3);
  const colors = [0x6b7a8f, 0x7d8ca3, 0x5f7267, 0x8a8577];
  const mountain = makeMountain(height, radius, colors[Math.floor(Math.random() * colors.length)]);
  mountain.position.x = x;
  mountain.position.z = z;
  scene.add(mountain);
}

const BOUNDARY_RADIUS = CITY_SIZE + 15; // ring of trees, just past the paved city
const MOUNTAIN_RADIUS = CITY_SIZE + 35; // sparser, taller mountains further back
// The walkable strip of open grass between the paved city and the tree
// ring — where the wild beasts (see below) roam.
const GRASS_MARGIN = 3;

function placeBoundaryRing() {
  const FAR = 400; // covers the rest of the 480x480 ground plane

  // Block movement past the ring entirely — four strips covering the grass
  // beyond it on each side — instead of just decorating the edge and
  // leaving it walkable.
  colliders.push({ minX: -FAR, maxX: FAR, minZ: BOUNDARY_RADIUS, maxZ: FAR });
  colliders.push({ minX: -FAR, maxX: FAR, minZ: -FAR, maxZ: -BOUNDARY_RADIUS });
  colliders.push({ minX: BOUNDARY_RADIUS, maxX: FAR, minZ: -FAR, maxZ: FAR });
  colliders.push({ minX: -FAR, maxX: -BOUNDARY_RADIUS, minZ: -FAR, maxZ: FAR });

  const TREE_RING_SCALE = TREE_SCALE * 1.6;
  for (let along = -BOUNDARY_RADIUS; along <= BOUNDARY_RADIUS; along += 14) {
    const jitter = (Math.random() - 0.5) * 4;
    const file = TREE_FILES[Math.floor(Math.random() * TREE_FILES.length)];
    placeTree(file, along + jitter, BOUNDARY_RADIUS + Math.random() * 4, TREE_RING_SCALE);
    placeTree(file, along + jitter, -(BOUNDARY_RADIUS + Math.random() * 4), TREE_RING_SCALE);
    placeTree(file, BOUNDARY_RADIUS + Math.random() * 4, along + jitter, TREE_RING_SCALE);
    placeTree(file, -(BOUNDARY_RADIUS + Math.random() * 4), along + jitter, TREE_RING_SCALE);
  }

  for (let along = -MOUNTAIN_RADIUS; along <= MOUNTAIN_RADIUS; along += 26) {
    const jitter = (Math.random() - 0.5) * 10;
    placeMountain(along + jitter, MOUNTAIN_RADIUS + Math.random() * 15);
    placeMountain(along + jitter, -(MOUNTAIN_RADIUS + Math.random() * 15));
    placeMountain(MOUNTAIN_RADIUS + Math.random() * 15, along + jitter);
    placeMountain(-(MOUNTAIN_RADIUS + Math.random() * 15), along + jitter);
  }
}

function placeBench(x, z, facingRotY) {
  const bench = makeBench();
  bench.position.set(x, 0, z);
  bench.rotation.y = facingRotY;
  scene.add(bench);
}

// Populates the sidewalk strip between the curb and a building row with
// alternating trees/benches, spaced out and skipping the crosswalk gap
// near the intersection. `fixedAxis`/`fixedSign` say which street edge this
// is (e.g. fixedAxis 'z' = the horizontal street's north/south sidewalk,
// fixedAxis 'x' = the vertical street's east/west sidewalk), so the same
// logic furnishes both streets.
function furnishSidewalk(fixedAxis, fixedSign) {
  const offsetFromCurb = fixedSign * (STREET_HALF_WIDTH + 1.6);
  const facingRotY = fixedAxis === 'z'
    ? (fixedSign > 0 ? Math.PI : 0)
    : (fixedSign > 0 ? -Math.PI / 2 : Math.PI / 2);
  let toggle = 0;
  for (let along = -(CITY_SIZE - 10); along <= CITY_SIZE - 10; along += 6) {
    if (Math.abs(along) < STREET_HALF_WIDTH + 2) continue; // leave the crosswalk clear
    const x = fixedAxis === 'z' ? along : offsetFromCurb;
    const z = fixedAxis === 'z' ? offsetFromCurb : along;
    if (toggle % 3 === 0) {
      placeTree(TREE_FILES[Math.floor(Math.random() * TREE_FILES.length)], x, z);
    } else if (toggle % 3 === 1) {
      placeBench(x, z, facingRotY);
    }
    toggle++;
  }
}

// Buildings are packed shoulder-to-shoulder: each new one is placed right
// against the edge of the previous one instead of on a fixed grid, so mixing
// narrow buildings and wide skyscrapers still looks tightly packed. A small
// negative gap makes them overlap by a hair so there's never a visible seam
// or a slit the player could squeeze through.
const BUILDING_GAP = -0.3;

// Fills one straight row of buildings lining a street edge. `fixedAxis`
// picks which street this row faces ('z' = the horizontal street, so the
// row is packed along X at a fixed Z; 'x' = the vertical street, packed
// along Z at a fixed X). `fixedSign`/`packSign` pick which of the two sides
// of that street, and which direction the row extends from the center.
async function buildRow(fixedAxis, fixedSign, packSign) {
  let fileIndex = Math.floor(Math.random() * BUILDING_FILES.length);
  let offset = ROW_SETBACK;
  const placements = [];
  for (let row = 0; row < ROWS_PER_SIDE; row++) {
    const file = BUILDING_FILES[fileIndex % BUILDING_FILES.length];
    fileIndex++;
    const isSkyscraper = file.includes('skyscraper');
    const half = isSkyscraper ? SKYSCRAPER_HALF_FOOTPRINT : BUILDING_HALF_FOOTPRINT;
    const centerOffset = offset + half;
    const scale = isSkyscraper ? SKYSCRAPER_SCALE : BUILDING_SCALE;

    let x, z, rotY;
    if (fixedAxis === 'z') {
      x = packSign * centerOffset;
      z = fixedSign * ROW_SETBACK;
      rotY = (fixedSign > 0 ? Math.PI : 0) + (packSign < 0 ? Math.PI : 0);
    } else {
      x = fixedSign * ROW_SETBACK;
      z = packSign * centerOffset;
      rotY = (fixedSign > 0 ? -Math.PI / 2 : Math.PI / 2) + (packSign < 0 ? Math.PI : 0);
    }

    placements.push(placeBuilding(file, x, z, rotY, scale));
    offset = centerOffset + half + BUILDING_GAP;
  }
  return Promise.all(placements);
}

// The paved sidewalk is only an L-shaped strip hugging the two streets (see
// SIDEWALK_DEPTH above); beyond it is open grass with nothing in it. Rather
// than let the player wander out there, each quadrant's open interior is
// sealed off with one big invisible collider — same mechanism as a building,
// just without a mesh — so the walkable area stays limited to the road, the
// sidewalk, and the buildings lining it.
function sealQuadrantInterior(signX, signZ) {
  const nearEdge = STREET_HALF_WIDTH + SIDEWALK_DEPTH;
  const farEdge = CITY_SIZE;
  const minX = signX > 0 ? nearEdge : -farEdge;
  const maxX = signX > 0 ? farEdge : -nearEdge;
  const minZ = signZ > 0 ? nearEdge : -farEdge;
  const maxZ = signZ > 0 ? farEdge : -nearEdge;
  colliders.push({ minX, maxX, minZ, maxZ });
}

// Resolves once every building/collider from buildCity() is in place, so
// anything that needs to pick a random *reachable* spot (the quest NPC,
// coin/pill pickups) can wait on the full collider list existing first.
let resolveCityReady;
const cityReady = new Promise((resolve) => { resolveCityReady = resolve; });

async function buildCity() {
  const jobs = [];
  [1, -1].forEach((fixedSign) => {
    [1, -1].forEach((packSign) => {
      jobs.push(buildRow('z', fixedSign, packSign)); // rows facing the horizontal (X) street
      jobs.push(buildRow('x', fixedSign, packSign)); // rows facing the vertical (Z) street
    });
  });
  await Promise.all(jobs);

  furnishSidewalk('z', 1);
  furnishSidewalk('z', -1);
  furnishSidewalk('x', 1);
  furnishSidewalk('x', -1);

  [1, -1].forEach((sx) => [1, -1].forEach((sz) => sealQuadrantInterior(sx, sz)));
  placeBoundaryRing();
  spawnBeasts();

  placeParkedCars();
  initPickups();
  spawnPedestrians();

  resolveCityReady();
}
buildCity();

// --- Reachability helpers ---
// A point is "reachable" if it isn't inside any collider (buildings, the
// sealed-off quadrant interiors, parked cars) and is within the paved city
// bounds. Used to scatter the quest NPC and pickups only where the player
// can actually walk.
function isReachable(x, z, margin) {
  if (Math.abs(x) > CITY_SIZE - 2 || Math.abs(z) > CITY_SIZE - 2) return false;
  return !colliders.some((c) =>
    x + margin > c.minX && x - margin < c.maxX &&
    z + margin > c.minZ && z - margin < c.maxZ
  );
}

function getRandomReachablePosition(margin = 0.6, avoid = null) {
  for (let i = 0; i < 300; i++) {
    const x = (Math.random() * 2 - 1) * (CITY_SIZE - 2);
    const z = (Math.random() * 2 - 1) * (CITY_SIZE - 2);
    if (avoid && Math.hypot(x - avoid.x, z - avoid.z) < avoid.radius) continue;
    if (isReachable(x, z, margin)) return { x, z };
  }
  return { x: 0, z: STREET_HALF_WIDTH + 2 }; // fallback: just off the spawn crosswalk
}

// --- Cars (simple procedural models — body + tinted cabin + wheels) ---
const CAR_COLORS = [0xd0392b, 0x2f6fd0, 0xd8c22f, 0x39a24a, 0xe8e8e8, 0x2b2b2b, 0xd06fbb];
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.7, 3.6),
    new THREE.MeshStandardMaterial({ color })
  );
  body.position.y = 0.55;
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.5, 1.8),
    new THREE.MeshStandardMaterial({ color: 0x9fd0ea, transparent: true, opacity: 0.7 })
  );
  cabin.position.set(0, 1.0, -0.2);
  g.add(body, cabin);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[-0.95, 1.2], [0.95, 1.2], [-0.95, -1.2], [0.95, -1.2]].forEach(([x, z]) => {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.3, 12), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.35, z);
    g.add(wheel);
  });
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// Parked cars sit right at the curb (on the road, not the sidewalk) all
// along both streets, and double as regular colliders so the player can't
// walk through them. Kept well outside the moving-traffic lane (see
// MOVING_LANES below) so through-traffic never overlaps them.
const PARKED_LANE_OFFSET = STREET_HALF_WIDTH - 1.3; // ~3.7, hugs the curb
function placeParkedCars() {
  const laneOffset = PARKED_LANE_OFFSET;
  const halfLen = 1.9, halfWid = 1.0;
  const addParked = (x, z, axis, rotY) => {
    const car = makeCar(CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
    car.position.set(x, 0, z);
    car.rotation.y = rotY;
    scene.add(car);
    const hx = axis === 'x' ? halfLen : halfWid;
    const hz = axis === 'x' ? halfWid : halfLen;
    colliders.push({ minX: x - hx, maxX: x + hx, minZ: z - hz, maxZ: z + hz });
  };
  [1, -1].forEach((sz) => {
    for (let x = -(CITY_SIZE - 20); x <= CITY_SIZE - 20; x += 22) {
      if (Math.abs(x) < STREET_HALF_WIDTH + 4) continue;
      if (Math.random() < 0.4) continue;
      // Car body's long axis is local Z, so it needs a 90° turn to lie
      // parallel to a street that runs along X (this is what was wrong —
      // it was left facing across the road instead of along it).
      addParked(x, sz * laneOffset, 'x', Math.PI / 2);
    }
  });
  [1, -1].forEach((sx) => {
    for (let z = -(CITY_SIZE - 20); z <= CITY_SIZE - 20; z += 22) {
      if (Math.abs(z) < STREET_HALF_WIDTH + 4) continue;
      if (Math.random() < 0.4) continue;
      addParked(sx * laneOffset, z, 'z', 0);
    }
  });
}

// --- Pedestrians ---
// Simple procedural walkers that patrol the same four sidewalk strips
// furnishSidewalk() decorates, looping from one end to the other like the
// moving cars do. Purely cosmetic background life — no collision with the
// player, traffic, or each other.
const PEDESTRIAN_COLORS = [0x3a6ea5, 0xd1495b, 0x8a5a44, 0x4a7c59, 0x9b59b6, 0xe0a458, 0x2f2f2f, 0xdedede];
function makePedestrian(shirtColor) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.22, 0.55, 4, 8),
    new THREE.MeshStandardMaterial({ color: shirtColor })
  );
  body.position.y = 0.62;
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0xe8b48c })
  );
  head.position.y = 1.15;
  g.add(body, head);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// Same four sidewalk strips as furnishSidewalk(): 'axis' is which street
// the strip faces (so pedestrians walk along the OTHER axis), 'cross' is
// the fixed offset from the road centerline.
const PEDESTRIAN_LANES = [
  { axis: 'z', cross: STREET_HALF_WIDTH + 1.6 },
  { axis: 'z', cross: -(STREET_HALF_WIDTH + 1.6) },
  { axis: 'x', cross: STREET_HALF_WIDTH + 1.6 },
  { axis: 'x', cross: -(STREET_HALF_WIDTH + 1.6) },
];
const PEDESTRIAN_RANGE = CITY_SIZE - 10; // matches furnishSidewalk's placement range
const pedestrians = []; // { mesh, lane, dir, speed, walkCycle }

function spawnPedestrians(perLane = 3) {
  PEDESTRIAN_LANES.forEach((lane) => {
    for (let i = 0; i < perLane; i++) {
      const mesh = makePedestrian(PEDESTRIAN_COLORS[Math.floor(Math.random() * PEDESTRIAN_COLORS.length)]);
      const along = -PEDESTRIAN_RANGE + Math.random() * PEDESTRIAN_RANGE * 2;
      const dir = Math.random() < 0.5 ? 1 : -1;
      if (lane.axis === 'z') mesh.position.set(along, 0, lane.cross);
      else mesh.position.set(lane.cross, 0, along);
      scene.add(mesh);
      pedestrians.push({ mesh, lane, dir, speed: 1.1 + Math.random() * 0.9, walkCycle: Math.random() * Math.PI * 2 });
    }
  });
}

function updatePedestrians(delta) {
  pedestrians.forEach((p) => {
    const moveDist = p.dir * p.speed * delta;
    if (p.lane.axis === 'z') p.mesh.position.x += moveDist;
    else p.mesh.position.z += moveDist;

    // Loop from one end of the sidewalk to the other, like the moving cars.
    const along = p.lane.axis === 'z' ? p.mesh.position.x : p.mesh.position.z;
    if (along > PEDESTRIAN_RANGE) {
      if (p.lane.axis === 'z') p.mesh.position.x = -PEDESTRIAN_RANGE; else p.mesh.position.z = -PEDESTRIAN_RANGE;
    } else if (along < -PEDESTRIAN_RANGE) {
      if (p.lane.axis === 'z') p.mesh.position.x = PEDESTRIAN_RANGE; else p.mesh.position.z = PEDESTRIAN_RANGE;
    }

    const forward = p.lane.axis === 'z' ? new THREE.Vector3(p.dir, 0, 0) : new THREE.Vector3(0, 0, p.dir);
    p.mesh.rotation.y = Math.atan2(forward.x, forward.z);

    p.walkCycle += delta * 7;
    p.mesh.position.y = Math.abs(Math.sin(p.walkCycle)) * 0.05;
  });
}

// --- Wild beasts in the grass beyond the city ---
// Roam the open grass strip between the paved city (CITY_SIZE) and the
// tree ring (BOUNDARY_RADIUS). Each is confined to one of the four strips
// around the city (its "zone") so it never wanders into the road network.
// They idly wander until the player gets close, then chase and, on
// contact, deal damage on a cooldown — same invulnerability-window pattern
// as the moving-car hits.
const BEAST_ZONES = [
  { minX: -BOUNDARY_RADIUS + 5, maxX: BOUNDARY_RADIUS - 5, minZ: CITY_SIZE + GRASS_MARGIN, maxZ: BOUNDARY_RADIUS - GRASS_MARGIN },
  { minX: -BOUNDARY_RADIUS + 5, maxX: BOUNDARY_RADIUS - 5, minZ: -(BOUNDARY_RADIUS - GRASS_MARGIN), maxZ: -(CITY_SIZE + GRASS_MARGIN) },
  { minX: CITY_SIZE + GRASS_MARGIN, maxX: BOUNDARY_RADIUS - GRASS_MARGIN, minZ: -BOUNDARY_RADIUS + 5, maxZ: BOUNDARY_RADIUS - 5 },
  { minX: -(BOUNDARY_RADIUS - GRASS_MARGIN), maxX: -(CITY_SIZE + GRASS_MARGIN), minZ: -BOUNDARY_RADIUS + 5, maxZ: BOUNDARY_RADIUS - 5 },
];

function makeBeast() {
  const g = new THREE.Group();
  const furMat = new THREE.MeshStandardMaterial({ color: 0x5b4636 });
  const legMat = new THREE.MeshStandardMaterial({ color: 0x3d2f22 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 2.6), furMat);
  body.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.9), furMat);
  head.position.set(0, 1.0, 1.5);
  g.add(body, head);
  [[-0.55, 0.9], [0.55, 0.9], [-0.55, -0.9], [0.55, -0.9]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.7, 0.28), legMat);
    leg.position.set(x, 0.35, z);
    g.add(leg);
  });
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

const BEASTS_PER_ZONE = 3;
const BEAST_WANDER_SPEED = 1.4;
const BEAST_CHASE_SPEED = 4.5;
const BEAST_CHASE_RADIUS = 16;
const BEAST_HIT_RADIUS = 1.6;
const BEAST_DAMAGE = 10;
const BEAST_HIT_INVULN = 1.0;
const beasts = []; // { mesh, zone, dir, speed, wanderTimer }
let lastBeastHitTime = -999;

function spawnBeasts() {
  BEAST_ZONES.forEach((zone) => {
    for (let i = 0; i < BEASTS_PER_ZONE; i++) {
      const mesh = makeBeast();
      const x = zone.minX + Math.random() * (zone.maxX - zone.minX);
      const z = zone.minZ + Math.random() * (zone.maxZ - zone.minZ);
      mesh.position.set(x, 0, z);
      const angle = Math.random() * Math.PI * 2;
      scene.add(mesh);
      beasts.push({
        mesh, zone,
        dir: new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle)),
        speed: BEAST_WANDER_SPEED,
        wanderTimer: 2 + Math.random() * 3,
      });
    }
  });
}

function updateBeasts(delta) {
  if (!character) return;
  beasts.forEach((b) => {
    const dx = character.position.x - b.mesh.position.x;
    const dz = character.position.z - b.mesh.position.z;
    const distToPlayer = Math.hypot(dx, dz);

    if (distToPlayer < BEAST_CHASE_RADIUS) {
      if (distToPlayer > 0.01) b.dir.set(dx / distToPlayer, 0, dz / distToPlayer);
      b.speed = BEAST_CHASE_SPEED;
    } else {
      b.wanderTimer -= delta;
      if (b.wanderTimer <= 0) {
        const angle = Math.random() * Math.PI * 2;
        b.dir.set(Math.sin(angle), 0, Math.cos(angle));
        b.wanderTimer = 2 + Math.random() * 3;
      }
      b.speed = BEAST_WANDER_SPEED;
    }

    let nx = b.mesh.position.x + b.dir.x * b.speed * delta;
    let nz = b.mesh.position.z + b.dir.z * b.speed * delta;
    // Bounce off its home strip's edges instead of wandering into the
    // paved city or out past the tree ring.
    if (nx < b.zone.minX || nx > b.zone.maxX) { b.dir.x *= -1; nx = b.mesh.position.x; }
    if (nz < b.zone.minZ || nz > b.zone.maxZ) { b.dir.z *= -1; nz = b.mesh.position.z; }
    b.mesh.position.x = nx;
    b.mesh.position.z = nz;
    b.mesh.rotation.y = Math.atan2(b.dir.x, b.dir.z);

    if (gameState === 'playing' && distToPlayer < BEAST_HIT_RADIUS) {
      const now = clock.elapsedTime;
      if (now - lastBeastHitTime >= BEAST_HIT_INVULN) {
        lastBeastHitTime = now;
        takeDamage(BEAST_DAMAGE);
      }
    }
  });
}

// --- Moving traffic ---
// Four one-way lanes (both directions on each of the two streets), each
// looping cars from one edge of the city to the other. Kept closer to the
// street's centerline than PARKED_LANE_OFFSET so through-traffic never
// shares a line with the parked cars hugging the curb.
// Needs to clear PARKED_LANE_OFFSET by more than the two cars' combined
// cross-axis half-widths (~2.2) — otherwise a moving car passing a parked
// one would register as a collision (blocked forever) even though they're
// meant to be in separate lanes.
const MOVING_LANE_OFFSET = STREET_HALF_WIDTH - 3.7; // ~1.3
const MOVING_LANES = [
  { axis: 'x', cross: MOVING_LANE_OFFSET, dir: 1 },
  { axis: 'x', cross: -MOVING_LANE_OFFSET, dir: -1 },
  { axis: 'z', cross: MOVING_LANE_OFFSET, dir: 1 },
  { axis: 'z', cross: -MOVING_LANE_OFFSET, dir: -1 },
];
const movingCars = [];
const CAR_HIT_RADIUS = 2.0;
const CAR_DAMAGE = 10;
const CAR_HIT_INVULN = 1.0; // seconds, matches the knockback cooldown
const CAR_HALF_LEN = 1.9, CAR_HALF_WID = 1.0;

function spawnMovingCars(perLane = 3) {
  MOVING_LANES.forEach((lane) => {
    for (let i = 0; i < perLane; i++) {
      const mesh = makeCar(CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
      const along = -CITY_SIZE + (i / perLane) * CITY_SIZE * 2 + Math.random() * 10;
      if (lane.axis === 'x') {
        mesh.position.set(along, 0, lane.cross);
        mesh.rotation.y = lane.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
      } else {
        mesh.position.set(lane.cross, 0, along);
        mesh.rotation.y = lane.dir > 0 ? 0 : Math.PI;
      }
      scene.add(mesh);
      movingCars.push({ mesh, lane, speed: 9 + Math.random() * 5 });
    }
  });
}
spawnMovingCars();

// AABB for a car centered at (x, z), accounting for which way it's facing
// (its long axis is local Z, so a car driving along world X needs its
// bounding box's long side on X instead). `margin` inflates it slightly so
// cars keep a small gap rather than touching bumper-to-bumper.
function carAABBAt(x, z, axis, margin = 0.2) {
  const halfLen = CAR_HALF_LEN + margin, halfWid = CAR_HALF_WID + margin;
  const hx = axis === 'x' ? halfLen : halfWid;
  const hz = axis === 'x' ? halfWid : halfLen;
  return { minX: x - hx, maxX: x + hx, minZ: z - hz, maxZ: z + hz };
}
function aabbOverlap(a, b) {
  return a.minX < b.maxX && a.maxX > b.minX && a.minZ < b.maxZ && a.maxZ > b.minZ;
}

function updateTraffic(delta) {
  movingCars.forEach((car) => {
    const { mesh, lane, speed } = car;
    const moveDist = speed * delta;
    let nextX = mesh.position.x, nextZ = mesh.position.z;
    if (lane.axis === 'x') nextX += lane.dir * moveDist;
    else nextZ += lane.dir * moveDist;

    const nextBox = carAABBAt(nextX, nextZ, lane.axis);
    // Only checked against static colliders (buildings/parked cars), not
    // other moving cars: checking moving-vs-moving used to let a couple of
    // cars end up permanently nose-to-tail (most often right near the map
    // edge, just before the wrap-around point), which then blocked every
    // car behind them forever and looked like traffic "getting stuck at the
    // boundary and never spawning again". Cars may now briefly overlap each
    // other, but they never freeze in place.
    const blocked = colliders.some((c) => aabbOverlap(nextBox, c));

    if (!blocked) {
      mesh.position.x = nextX;
      mesh.position.z = nextZ;
    }

    if (mesh.position.x > CITY_SIZE) mesh.position.x = -CITY_SIZE;
    if (mesh.position.x < -CITY_SIZE) mesh.position.x = CITY_SIZE;
    if (mesh.position.z > CITY_SIZE) mesh.position.z = -CITY_SIZE;
    if (mesh.position.z < -CITY_SIZE) mesh.position.z = CITY_SIZE;
  });
}

function updateTrafficCollisions() {
  if (!character) return;
  for (const { mesh } of movingCars) {
    const dx = character.position.x - mesh.position.x;
    const dz = character.position.z - mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < CAR_HIT_RADIUS) {
      const now = clock.elapsedTime;
      if (now - lastHitTime < CAR_HIT_INVULN) continue;
      lastHitTime = now;
      takeDamage(CAR_DAMAGE);
      const pushX = dist > 0.001 ? dx / dist : 1;
      const pushZ = dist > 0.001 ? dz / dist : 0;
      startKnockback(pushX, pushZ);
      return;
    }
  }
  for (const { mesh } of motorcycles) {
    const dx = character.position.x - mesh.position.x;
    const dz = character.position.z - mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < MOTORCYCLE_HIT_RADIUS) {
      const now = clock.elapsedTime;
      if (now - lastHitTime < CAR_HIT_INVULN) continue;
      lastHitTime = now;
      takeDamage(CAR_DAMAGE);
      const pushX = dist > 0.001 ? dx / dist : 1;
      const pushZ = dist > 0.001 ? dz / dist : 0;
      startKnockback(pushX, pushZ);
      return;
    }
  }
}

// --- Motorcycles ---
// Unlike the disciplined moving-car lanes, these weave erratically across
// the full street width ("亂竄") rather than holding a fixed lane, and
// don't check collisions against anything (buildings, cars, each other,
// or the player's non-hit radius) — they're background chaos, not traffic
// with rules. Hitting the player deals the same damage/knockback as a car.
function makeMotorcycle(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.8), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.45;
  const rider = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.5, 4, 8), new THREE.MeshStandardMaterial({ color: 0x2b2b2b }));
  rider.position.set(0, 0.95, -0.1);
  g.add(body, rider);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[0, 0.75], [0, -0.75]].forEach(([x, z]) => {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 12), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.28, z);
    g.add(wheel);
  });
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

const MOTORCYCLE_COLORS = [0xff3b30, 0x1c1c1e, 0xffd60a, 0x0a84ff, 0x30d158, 0xff9f0a];
const MOTORCYCLE_COUNT = 24;
const MOTORCYCLE_HIT_RADIUS = 1.6;
const motorcycles = []; // { mesh, axis, dir, speed, cross0, wobblePhase, wobbleSpeed, wobbleAmp }

function spawnMotorcycles() {
  for (let i = 0; i < MOTORCYCLE_COUNT; i++) {
    const axis = Math.random() < 0.5 ? 'x' : 'z';
    const dir = Math.random() < 0.5 ? 1 : -1;
    const mesh = makeMotorcycle(MOTORCYCLE_COLORS[Math.floor(Math.random() * MOTORCYCLE_COLORS.length)]);
    const along = -CITY_SIZE + Math.random() * CITY_SIZE * 2;
    const cross0 = (Math.random() * 2 - 1) * (STREET_HALF_WIDTH - 2.2);
    if (axis === 'x') { mesh.position.set(along, 0, cross0); mesh.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
    else { mesh.position.set(cross0, 0, along); mesh.rotation.y = dir > 0 ? 0 : Math.PI; }
    scene.add(mesh);
    motorcycles.push({
      mesh, axis, dir,
      speed: 10 + Math.random() * 8,
      cross0,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleSpeed: 1.5 + Math.random() * 1.5,
      wobbleAmp: 0.5 + Math.random() * 1,
      charging: false,
      chargeDir: null,
    });
  }
}

function updateMotorcycles(delta) {
  motorcycles.forEach((m) => {
    if (m.charging) {
      // 行人地獄 charge: aimed once at wherever the player was standing
      // when the charge started, then drives dead straight — never
      // re-aims mid-charge, so dodging it actually works instead of it
      // homing in like a magnet.
      m.mesh.position.x += m.chargeDir.x * HELL_CHARGE_SPEED * delta;
      m.mesh.position.z += m.chargeDir.z * HELL_CHARGE_SPEED * delta;
      m.mesh.rotation.y = Math.atan2(m.chargeDir.x, m.chargeDir.z);
      return;
    }
    m.wobblePhase += delta * m.wobbleSpeed;
    const maxCross = STREET_HALF_WIDTH - 1.6; // stay well clear of the sidewalk curb at STREET_HALF_WIDTH
    const cross = THREE.MathUtils.clamp(m.cross0 + Math.sin(m.wobblePhase) * m.wobbleAmp, -maxCross, maxCross);
    if (m.axis === 'x') {
      m.mesh.position.x += m.dir * m.speed * delta;
      m.mesh.position.z = cross;
      if (m.mesh.position.x > CITY_SIZE) m.mesh.position.x = -CITY_SIZE;
      if (m.mesh.position.x < -CITY_SIZE) m.mesh.position.x = CITY_SIZE;
    } else {
      m.mesh.position.z += m.dir * m.speed * delta;
      m.mesh.position.x = cross;
      if (m.mesh.position.z > CITY_SIZE) m.mesh.position.z = -CITY_SIZE;
      if (m.mesh.position.z < -CITY_SIZE) m.mesh.position.z = CITY_SIZE;
    }
  });
}
spawnMotorcycles();

// --- Coin & pill pickups ---
function makeCoin() {
  const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, 0.08, 20),
    new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.25, emissive: 0x553c00, emissiveIntensity: 0.4 })
  );
  coin.rotation.x = Math.PI / 2;
  coin.castShadow = true;
  return coin;
}
function makePill() {
  const g = new THREE.Group();
  const half = new THREE.MeshStandardMaterial({ color: 0xff8c1a });
  const otherHalf = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const capsule = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.45, 4, 10), half);
  capsule.rotation.z = Math.PI / 2;
  g.add(capsule);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeReceipt() {
  const g = new THREE.Group();
  const paper = new THREE.Mesh(
    new THREE.BoxGeometry(0.42, 0.03, 0.58),
    new THREE.MeshStandardMaterial({ color: 0xfafafa })
  );
  const clip = new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.02, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x3fa0e0 })
  );
  clip.position.set(0, 0.02, -0.22);
  g.add(paper, clip);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });

}

const pickups = []; // { mesh, type: 'coin' | 'pill' | 'receipt' }
function spawnPickup(type) {
  const mesh = type === 'coin' ? makeCoin() : type === 'pill' ? makePill() : makeReceipt();
  const pos = getRandomReachablePosition(0.6);
  mesh.position.set(pos.x, type === 'coin' ? 0.5 : type === 'pill' ? 0.6 : 0.4, pos.z);
  scene.add(mesh);
  pickups.push({ mesh, type });
}

const COIN_COUNT = 18;
const PILL_COUNT = 10;
const PICKUP_RADIUS = 1.1;
function initPickups() {
  for (let i = 0; i < COIN_COUNT; i++) spawnPickup('coin');
  for (let i = 0; i < PILL_COUNT; i++) spawnPickup('pill');
}

// "我要報帳" quest progress — how many of the 10 scattered receipts have
// been picked up so far. Receipts don't respawn once collected (unlike
// coins/pills), since they're a fixed one-time collection target.
let receiptCount = 0;
const RECEIPT_TARGET = 10;

function updatePickups(delta) {
  if (!character) return;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.mesh.rotation.y += delta * 2.2;
    const dx = character.position.x - p.mesh.position.x;
    const dz = character.position.z - p.mesh.position.z;
    if (Math.hypot(dx, dz) > PICKUP_RADIUS) continue;

    if (p.type === 'coin') {
      addMoney(10);
    } else if (p.type === 'pill') {
      if (hp >= 100) continue; // full health — leave the pill for later
      heal(10);
    } else if (p.type === 'receipt') {
      receiptCount++;
      renderQuestPanel();
      scene.remove(p.mesh);
      pickups.splice(i, 1);
      if (receiptCount >= RECEIPT_TARGET) {
        gameState = 'questComplete'; // freezes input until confirmed
        showFoundOverlay('📋 收集齊全！', '找到 Julie 交付報帳收據吧！', () => startJulieDeliverPhase());
      }
      continue;
    }
    const pos = getRandomReachablePosition(0.6);
    p.mesh.position.x = pos.x;
    p.mesh.position.z = pos.z;
  }
}

// --- Quest system ---
// A small generic quest list so more quests can be added later without
// rewriting this panel. Each quest starts 'available' and only does
// anything once the player clicks it to accept — nothing quest-related
// (like the NPC actually appearing) happens before that. The `quests`
// object itself, and the "尋找 Julie" chain that grows out of it, is
// defined further down (see checkQuestProgress and friends).

function renderQuestPanel() {
  const list = document.getElementById('questList');
  list.innerHTML = '';
  Object.entries(quests).forEach(([id, q]) => {
    const row = document.createElement('div');
    row.className = `quest-row quest-${q.state}`;
    const icon = q.state === 'completed' ? '✅' : q.state === 'active' ? '🔸' : '⬜';
    const hint = q.state === 'available' ? '點擊接受任務' : (typeof q.hint === 'function' ? q.hint() : (q.hint || ''));
    row.innerHTML = `${icon} ${q.title}<span class="quest-hint">${hint}</span>`;
    if (q.state === 'available') {
      row.addEventListener('click', () => beginQuestIntro(id));
    }
    list.appendChild(row);
  });
}

function acceptQuest(id) {
  const q = quests[id];
  if (!q || q.state !== 'available') return;
  q.state = 'active';
  renderQuestPanel();
  if (q.onAccept) q.onAccept();
}

function completeQuest(id) {
  quests[id].state = 'completed';
  renderQuestPanel();
}

// --- Generic dialog cutscene ---
// Used for (a) accepting a quest from the panel and (b) mid-quest story
// beats (Julie/Gloria speaking). In both cases the camera swings to whoever
// is speaking (`cutsceneTarget` — the player character or an NPC), shows a
// dialog with an optional portrait, holds until confirmed, then swings back
// to the normal gameplay camera. Movement is frozen throughout since none
// of the intermediate gameState values here are 'playing'.
const CUTSCENE_CAM_DURATION = 0.6;
let cutsceneStart = 0;
let cutsceneTarget = null;
let dialogMode = null; // 'accept' | 'story'
let pendingQuestId = null;
let pendingConfirm = null;
let pendingDialogTitle = '', pendingDialogText = '', pendingPortraitModel = null, pendingPortraitRotY = 0.4;
let pendingHintModel = null, pendingHintRotY = 0.4, pendingHintLabel = '';

// Camera position/lookAt for framing an arbitrary actor's face — same
// convention as the character's own front view (rest pose faces +Z), but
// rotated by the actor's current facing so it works for NPCs too.
function getTargetFrontCamPos(actor) {
  return actor.position.clone().add(new THREE.Vector3(0, 1.6, 3.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), actor.rotation.y));
}
function getTargetFrontLookAt(actor) {
  return actor.position.clone().add(new THREE.Vector3(0, 1.5, 0));
}

function beginDialogCutscene(target, title, text, portraitModel, mode, onConfirm, portraitRotY = 0.4, hintModel = null, hintRotY = 0.4, hintLabel = '') {
  if (gameState !== 'playing' || !character || !target) return;
  cutsceneTarget = target;
  dialogMode = mode;
  pendingConfirm = onConfirm || null;
  pendingDialogTitle = title;
  pendingDialogText = text;
  pendingPortraitModel = portraitModel || null;
  pendingPortraitRotY = portraitRotY;
  pendingHintModel = hintModel || null;
  pendingHintRotY = hintRotY;
  pendingHintLabel = hintLabel;
  gameState = 'dialogCamIn';
  cutsceneStart = clock.elapsedTime;
}

function beginQuestIntro(id) {
  const q = quests[id];
  if (!q || q.state !== 'available' || gameState !== 'playing' || !character) return;
  pendingQuestId = id;
  const portraitModel = q.portrait ? q.portrait() : null;
  beginDialogCutscene(character, q.title, q.description, portraitModel, 'accept', null);
}

function updateDialogCinematic() {
  if (gameState === 'dialogCamIn') {
    const t = Math.min(1, (clock.elapsedTime - cutsceneStart) / CUTSCENE_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getGameplayCamPos(), getTargetFrontCamPos(cutsceneTarget), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getGameplayLookAt(), getTargetFrontLookAt(cutsceneTarget), e));
    if (t >= 1) {
      document.getElementById('questDialogTitle').textContent = pendingDialogTitle;
      document.getElementById('questDialogText').textContent = pendingDialogText;
      const canvas = document.getElementById('questPortrait');
      if (pendingPortraitModel) {
        canvas.style.display = 'block';
        renderPortraitOf(pendingPortraitModel, pendingPortraitRotY);
      } else {
        canvas.style.display = 'none';
      }
      document.getElementById('questPortrait2').style.display = 'none'; // only showRescueLine's dual-speaker lines use this one
      const hintBox = document.getElementById('questHintBox');
      if (pendingHintModel) {
        hintBox.style.display = 'block';
        document.getElementById('questHintLabel').textContent = pendingHintLabel;
        renderHintPortraitOf(pendingHintModel, pendingHintRotY);
      } else {
        hintBox.style.display = 'none';
      }
      document.getElementById('questIntroDialog').style.display = 'block';
      gameState = 'dialogHold';
    }
  } else if (gameState === 'dialogHold') {
    // Holds here (no auto-timeout) until the confirm button is clicked.
    camera.position.copy(getTargetFrontCamPos(cutsceneTarget));
    camera.lookAt(getTargetFrontLookAt(cutsceneTarget));
  } else if (gameState === 'dialogCamOut') {
    const t = Math.min(1, (clock.elapsedTime - cutsceneStart) / CUTSCENE_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getTargetFrontCamPos(cutsceneTarget), getGameplayCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getTargetFrontLookAt(cutsceneTarget), getGameplayLookAt(), e));
    if (t >= 1) {
      gameState = 'playing';
      cutsceneTarget = null;
    }
  }
}

// --- Quest NPCs: Julie & Gloria ---
// Both models load in the background as soon as the page does (they're
// large files), but neither is placed in the world or tracked for a quest
// until the player actually accepts the relevant quest from the panel.
const npcMixers = [];

function loadNPC(path, targetHeight = 1.8) {
  return new Promise((resolve) => {
    const ldr = new GLTFLoader();
    ldr.load(
      path,
      (gltf) => {
        const m = gltf.scene;
        m.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
          }
        });
        // Some of these models (Gloria's, evidently) have their bind pose
        // lying on their side — not standing — with an animation clip that
        // rotates them upright as it plays. Looping that clip forever was
        // the earlier fix's mistake: it looked fine briefly, then a full
        // turntable rotation continued past "upright" the longer it played,
        // eventually leaving her lying down again. The fix is to apply
        // exactly frame 0 of the clip (which IS the upright pose) and then
        // stop — never advancing again — before measuring/aligning
        // anything below, so a corrected, permanently frozen pose is what
        // gets scaled, ground-aligned, and cloned for portraits.
        if (gltf.animations && gltf.animations.length > 0) {
          const mx = new THREE.AnimationMixer(m);
          const action = mx.clipAction(gltf.animations[0]);
          action.play();
          mx.update(0);
          action.stop();
          // The mixer only updates the animated properties (position/
          // quaternion/scale) — matrixWorld itself is normally refreshed
          // by the renderer each frame, not synchronously here. Without
          // forcing it now, the Box3 measurements below silently used the
          // *previous* (bind-pose) world matrices regardless of the pose
          // just applied above, which is why the ground-alignment came out
          // wrong even after "fixing" the pose — the two were computed
          // from different transforms.
          m.updateMatrixWorld(true);
        }

        m.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(m);
        const size = new THREE.Vector3();
        box.getSize(size);
        m.scale.setScalar(targetHeight / (size.y || 1));
        m.updateMatrixWorld(true);
        const box2 = new THREE.Box3().setFromObject(m);
        m.position.y -= box2.min.y;

        // A clone taken now (frozen pose, ground-aligned) — portraits
        // always render from this instead of the live `m`, and `m` itself
        // is never animated further either, so nothing in the world can
        // drift out of this pose over time.
        const portraitSource = cloneSkinned(m);

        resolve({ model: m, mixers: [], portraitSource });
      },
      undefined,
      (err) => { console.error('Failed to load NPC model', path, err); resolve(null); }
    );
  });
}

// A tiny standalone scene + renderer just for the head-and-shoulders
// portrait shown in dialogs — a fresh SkeletonUtils clone of whichever
// actor is speaking, so it's independent of that actor's (possibly
// off-screen / not-yet-spawned) position in the main world. A plain
// .clone(true) doesn't rebind a SkinnedMesh's skeleton, which leaves it
// collapsed/invisible — SkeletonUtils' clone() handles that.
function createPortraitRig(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(size, size);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
  dirLight.position.set(1, 2, 3);
  scene.add(dirLight);
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 10);
  return { renderer, scene, camera };
}

let mainPortraitRig = null, hintPortraitRig = null, portraitRig2 = null;
function setupPortraitRig() {
  mainPortraitRig = createPortraitRig('questPortrait', 120);
  hintPortraitRig = createPortraitRig('questHintPortrait', 70);
  portraitRig2 = createPortraitRig('questPortrait2', 120);
}
setupPortraitRig();

function renderIntoRig(rig, sourceModel, rotationY = 0.4) {
  if (!rig || !sourceModel) return;
  const clone = cloneSkinned(sourceModel);
  clone.position.set(0, 0, 0);
  clone.rotation.y = rotationY; // slight turn; camera sits on the model's rest-facing (+Z) side
  // Fully metallic materials (e.g. some scanned models) render almost black
  // under this scene's simple hemisphere + directional lights since there's
  // no environment map to reflect — clone the material and cap metalness
  // just for the portrait so the face is actually visible.
  clone.traverse((o) => {
    if (o.isMesh && o.material) {
      const mats = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
      o.material = mats;
      (Array.isArray(mats) ? mats : [mats]).forEach((m) => {
        if ('metalness' in m) m.metalness = Math.min(m.metalness, 0.15);
      });
    }
  });
  rig.scene.add(clone);

  // Distance/framing is derived from the model's own footprint rather than
  // a fixed number — a hardcoded z=0.55 worked for human-proportioned
  // models but put the camera *inside* a wider/deeper model (rendering
  // nothing, since you were looking at the inside of its back-culled
  // faces). Tall-and-narrow models (people) get a tight head-and-shoulders
  // crop; anything wider/flatter (not humanoid, or a small prop like a
  // receipt) gets framed so the whole model fits in view instead of
  // guessing where its "face" is.
  const box = new THREE.Box3().setFromObject(clone);
  const size = new THREE.Vector3();
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);
  const isHumanoid = size.y > size.x * 1.3 && size.y > size.z * 1.3;
  if (isHumanoid) {
    const headY = box.max.y - Math.min(0.14, size.y * 0.1);
    const camDist = Math.max(size.x, size.z) / 2 + 0.35;
    rig.camera.position.set(center.x, headY, center.z + camDist);
    rig.camera.lookAt(center.x, headY, center.z);
  } else {
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    const fovRad = THREE.MathUtils.degToRad(rig.camera.fov);
    const camDist = (sphere.radius / Math.sin(fovRad / 2)) * 1.2;
    rig.camera.position.set(sphere.center.x, sphere.center.y, sphere.center.z + camDist);
    rig.camera.lookAt(sphere.center);
  }
  rig.renderer.render(rig.scene, rig.camera);

  rig.scene.remove(clone);
  clone.traverse((o) => {
    if (o.isMesh) {
      o.geometry.dispose();
      (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    }
  });
}

function renderPortraitOf(sourceModel, rotationY = 0.4) {
  renderIntoRig(mainPortraitRig, sourceModel, rotationY);
}
function renderHintPortraitOf(sourceModel, rotationY = 0.4) {
  renderIntoRig(hintPortraitRig, sourceModel, rotationY);
}
function renderPortraitOf2(sourceModel, rotationY = 0.4) {
  renderIntoRig(portraitRig2, sourceModel, rotationY);
}

// --- NPCs running off after their part of the story is done ---
const runningAwayNpcs = []; // { mesh, dir, speed, life, onDone }
function startRunAway(npcMesh, onDone) {
  const angle = Math.random() * Math.PI * 2;
  runningAwayNpcs.push({
    mesh: npcMesh,
    dir: new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle)),
    speed: 14,
    life: 0,
    onDone: onDone || null,
  });
}
function updateRunningAwayNpcs(delta) {
  for (let i = runningAwayNpcs.length - 1; i >= 0; i--) {
    const r = runningAwayNpcs[i];
    r.mesh.position.addScaledVector(r.dir, r.speed * delta);
    r.mesh.rotation.y = Math.atan2(r.dir.x, r.dir.z);
    r.life += delta;
    if (r.life > 1.2) {
      scene.remove(r.mesh);
      runningAwayNpcs.splice(i, 1);
      if (r.onDone) r.onDone();
    }
  }
}

const FOUND_DISTANCE = 2.5;

// --- Quest chain state ---
// julliePhase: null | 'seek' (找到Julie) | 'deliver' (交付收據) | 'awaitReturn' (交付機票)

let gloriaPhase = null;

let foundOverlayOnConfirm = null;

// --- Quest table -------------------------------------------------------
// Every quest's display text and unlock behavior lives here, in one place.
// `quests` (below) holds the LIVE state (which quests are currently
// visible and their state: available/active/completed); this table is the
// static definition they're built from.
//
// TO ADD A NEW QUEST:
//   1. Add an entry below with a unique key: `title`, `hint` (string, or a
//      function for text that updates live, e.g. a progress counter),
//      `description` (shown in the accept-dialog), and optionally
//      `portrait()` (returns a THREE.Object3D to preview in that dialog —
//      omit for no portrait) and `onAccept()` (runs once the player clicks
//      accept — spawn an NPC, scatter pickups, whatever the quest needs).
//   2. Call `unlockQuest('yourKey')` from wherever the PREVIOUS step's
//      completion logic should reveal it (see the beginDialogCutscene /
//      showFoundOverlay callbacks in checkQuestProgress and updatePickups
//      for the existing chain's examples).
//   3. Write whatever completion-detection your quest needs — reaching an
//      NPC (see checkQuestProgress's julliePhase/gloriaPhase pattern) or
//      collecting N items (see updatePickups' receipt-counting branch) are
//      the two patterns already used; copy whichever fits, or add a new
//      one if the quest needs a different trigger entirely.
//   Pass `{ state: 'active' }` as unlockQuest's second argument for a
//   quest that should skip the accept dialog and start immediately (like
//   returnToJulie below, which continues straight out of finding Gloria).
const QUEST_TABLE = {
  findJulie: {
    title: '尋找 Julie',

const quests = {}; // live quest state: { ...QUEST_TABLE[id], state, ... }

function unlockQuest(id, overrides = {}) {
  const def = QUEST_TABLE[id];
  if (!def) { console.error('unlockQuest: unknown quest id', id); return; }
  quests[id] = { ...def, state: 'available', ...overrides };
  renderQuestPanel();
}

unlockQuest('findJulie');
unlockQuest('pedestrianHell');

async function startFindJulieQuest() {
  await Promise.all([cityReady, npcReady, characterReady]);
  const pos = getRandomReachablePosition(1.0, { x: character.position.x, z: character.position.z, radius: 20 });
  npc.position.x = pos.x;
  npc.position.z = pos.z; // never touch .y — loadNPC's ground-alignment offset lives there
  npc.rotation.y = Math.random() * Math.PI * 2;
  if (!npc.parent) scene.add(npc);
  julliePhase = 'seek';
}

function startReportReceiptsQuest() {

}

function startJulieDeliverPhase() {

async function startFindGloriaQuest() {
