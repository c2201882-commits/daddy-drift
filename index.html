<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<!-- Without this, mobile browsers render at a virtual desktop-width
     viewport (~980px) and scale the whole page down to fit, which is why
     everything looked tiny on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>爹地漂流記</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
  #topRightBar {
    position: fixed; top: 10px; right: 10px; z-index: 10; display: none;
    align-items: flex-start; gap: 8px;
  }
  #helpBtn {
    width: 30px; height: 30px; border-radius: 50%; border: none; flex-shrink: 0;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer; line-height: 30px; padding: 0;
  }
  #helpPanel {
    position: fixed; top: 48px; right: 10px; z-index: 12; display: none;
    color: #fff; background: rgba(0,0,0,0.8);
    padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.6;
    max-width: 220px;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; background: #222; z-index: 20;
  }
  #questPanel {
    position: fixed; top: 10px; left: 10px; z-index: 10; display: none;
    background: rgba(0,0,0,0.55); color: #fff; border-radius: 10px; padding: 10px 14px;
    min-width: 180px; font-size: 13px;
  }
  #questPanel h3 { margin: 0 0 6px 0; font-size: 13px; letter-spacing: 2px; opacity: 0.8; }
  .quest-row {
    padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; line-height: 1.4;
  }
  .quest-row.quest-available { background: rgba(255,213,74,0.18); cursor: pointer; }
  .quest-row.quest-available:hover { background: rgba(255,213,74,0.32); }
  .quest-row.quest-active { background: rgba(80,160,255,0.22); }
  .quest-row.quest-completed { opacity: 0.55; text-decoration: line-through; }
  .quest-row .quest-hint { display: block; font-size: 11px; opacity: 0.75; margin-top: 2px; }
  #questArrow {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: none; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  #questArrowIcon {
    font-size: 34px; line-height: 1; color: #ffd54a;
    text-shadow: 0 0 6px rgba(0,0,0,0.7), 0 0 2px rgba(0,0,0,0.9);
    transition: transform 0.15s linear;
  }
  #questArrowDist {
    margin-top: 2px; font-size: 12px; color: #fff; background: rgba(0,0,0,0.55);
    padding: 2px 9px; border-radius: 10px;
  }
  #hud {
    background: rgba(0,0,0,0.55); color: #fff; border-radius: 10px; padding: 10px 14px;
    font-size: 13px; min-width: 160px;
  }
  #hpRow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #hpBarOuter { flex: 1; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden; }
  #hpBarFill { height: 100%; background: linear-gradient(90deg,#ff5050,#ff8a50); width: 100%; transition: width 0.2s; }
  #moneyRow { display: flex; align-items: center; gap: 6px; }
  #mobileControls {
    position: fixed; inset: 0; z-index: 15; display: none; pointer-events: none;
  }
  #joystickBase {
    position: absolute; left: 24px; bottom: 24px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.35); pointer-events: auto;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #joystickKnob {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
    margin-left: -29px; margin-top: -29px; border-radius: 50%;
    background: rgba(255,255,255,0.55); pointer-events: none;
    transition: transform 0.06s linear;
  }
  .mc-btn:active { background: rgba(255,255,255,0.5); }
  #mcActions {
    position: absolute; right: 16px; bottom: 16px; pointer-events: auto;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .mc-wide {
    width: 104px; height: 50px; border-radius: 25px; border: none;
    background: rgba(255,213,74,0.9); color: #1b2a4a; font-weight: bold;
    font-size: 14px; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .mc-wide:active { background: rgba(255,213,74,1); }
  #zoomSliderWrap {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 200px; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
  }
  #zoomSlider {
    width: 180px; height: 36px;
    transform: rotate(-90deg);
    touch-action: none;
  }
  #startScreen {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background: linear-gradient(180deg, #1b2a4a 0%, #0c1424 100%);
  }
  #startScreen h1 { color: #fff; font-size: 32px; margin: 0; letter-spacing: 4px; }
  #startBtn {
    padding: 16px 56px; font-size: 22px; font-weight: bold; letter-spacing: 4px;
    color: #1b2a4a; background: #ffd54a; border: none; border-radius: 10px;
    cursor: pointer; box-shadow: 0 6px 0 #c9a530; transition: transform 0.1s;
  }
  #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9a530; }
  #startBtn:disabled { opacity: 0.6; cursor: default; }
  #dialogBox {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    z-index: 25; display: none; background: rgba(20, 20, 30, 0.92); color: #fff;
    padding: 22px 28px; border-radius: 12px; border: 2px solid #ffd54a;
    max-width: 480px; width: 86%; text-align: center; font-size: 18px;
  }
  #dialogBox p { margin: 0 0 16px 0; line-height: 1.6; }
  #dialogConfirm {
    padding: 10px 36px; font-size: 16px; font-weight: bold; color: #1b2a4a;
    background: #ffd54a; border: none; border-radius: 8px; cursor: pointer;
  }
  #foundOverlay {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center;
    justify-content: center; background: rgba(0,0,0,0.6);
  }
  #foundOverlay .card {
    background: rgba(20, 20, 30, 0.95); color: #fff; padding: 32px 40px; border-radius: 14px;
    border: 2px solid #ffd54a; text-align: center; max-width: 420px; width: 86%;
  }
  #foundOverlay h2 { margin: 0 0 12px 0; font-size: 26px; }
  #foundOverlay p { margin: 0 0 20px 0; line-height: 1.6; }
  #foundConfirm {
    padding: 10px 36px; font-size: 16px; font-weight: bold; color: #1b2a4a;
    background: #ffd54a; border: none; border-radius: 8px; cursor: pointer;
  }
  #moneyDialog {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
    z-index: 25; display: none; background: rgba(20, 20, 30, 0.92); color: #fff;
    padding: 16px 32px; border-radius: 12px; border: 2px solid #ffd54a;
    font-size: 20px; text-align: center;
  }
  #questIntroDialog {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    z-index: 25; display: none; background: rgba(20, 20, 30, 0.92); color: #fff;
    padding: 22px 28px; border-radius: 12px; border: 2px solid #ffd54a;
    max-width: 480px; width: 86%; text-align: center;
  }
  #questIntroDialog h3 { margin: 0 0 8px 0; font-size: 18px; }
  #questIntroDialog p { margin: 0 0 16px 0; line-height: 1.6; font-size: 15px; }
  #questPortrait { display: block; margin: 0 auto 10px; border-radius: 50%; background: #2a3a55; }
  #questHintBox { display: none; margin: 0 0 14px 0; }
  #questHintBox .label { font-size: 11px; opacity: 0.75; margin-bottom: 4px; }
  #questHintPortrait { display: block; margin: 0 auto; border-radius: 50%; background: #2a3a55; border: 1px solid rgba(255,213,74,0.6); }
  #questDialogConfirm {
    padding: 10px 36px; font-size: 16px; font-weight: bold; color: #1b2a4a;
    background: #ffd54a; border: none; border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="loading">載入模型中... 0%</div>
<div id="startScreen">

</div>
<div id="topRightBar">
  <button id="helpBtn">？</button>
  <div id="hud">

      <span>❤️</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';

// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
// Starts high above the whole map for the opening cinematic (see the
// game-state machine near the bottom); swaps to a normal follow cam once
// gameplay begins.
camera.position.set(0, 260, 0.01);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- Lights ---
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(10, 20, 10);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -30;
dir.shadow.camera.right = 30;
dir.shadow.camera.top = 30;
dir.shadow.camera.bottom = -30;
scene.add(dir);

// --- Ground (grass beyond the city block) ---
const groundGeo = new THREE.PlaneGeometry(480, 480);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x5b8a4a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// --- City block: road + sidewalks ---
const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
const CITY_SIZE = 140; // half-width of the paved city block

const road = new THREE.Mesh(new THREE.PlaneGeometry(CITY_SIZE * 2, CITY_SIZE * 2), roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0;
road.receiveShadow = true;
scene.add(road);

// Lane markings down the middle of the two main streets
const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x222222 });
for (let i = -CITY_SIZE; i < CITY_SIZE; i += 4) {
  const lineH = new THREE.Mesh(new THREE.PlaneGeometry(2, 0.3), lineMat);
  lineH.rotation.x = -Math.PI / 2;
  lineH.position.set(i + 1, 0.01, 0);
  scene.add(lineH);
  const lineV = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 2), lineMat);
  lineV.rotation.x = -Math.PI / 2;
  lineV.position.set(0, 0.01, i + 1);
  scene.add(lineV);
}

// Sidewalks bordering each city block (4 quadrants split by the cross streets)
const STREET_HALF_WIDTH = 5;
const sidewalkThickness = 0.15;

// Native building models are only ~2-4 units tall (they're single-storey
// Kenney kit pieces, ~2x2 footprint). Scaled up so buildings tower over the
// 1.8m-tall character instead of being roughly the same size.
const BUILDING_SCALE = 6;
const SKYSCRAPER_SCALE = 9;
const BUILDING_HALF_FOOTPRINT = BUILDING_SCALE;      // ~6
const SKYSCRAPER_HALF_FOOTPRINT = SKYSCRAPER_SCALE;  // ~9

// Buildings sit close to the road, leaving only a slim sidewalk strip
// between the curb and the building fronts (instead of a deep plaza).
const ROW_SETBACK = STREET_HALF_WIDTH + 3 + SKYSCRAPER_HALF_FOOTPRINT; // distance from street centerline to each row's baseline
const ROWS_PER_SIDE = 8; // buildings packed side by side along each sidewalk edge — as many as fit
// How far the paved sidewalk extends past the curb — just enough to cover
// the building fronts, not a step further. Everything past this is grass,
// and a matching invisible wall (see below) stops the player from walking
// out into that open space around the ends of a building row.
const SIDEWALK_DEPTH = (ROW_SETBACK + SKYSCRAPER_HALF_FOOTPRINT + 3) - STREET_HALF_WIDTH;

function addSidewalkBlock(x, z, w, d) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, sidewalkThickness, d), sidewalkMat);
  mesh.position.set(x, sidewalkThickness / 2, z);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  scene.add(mesh);
  return mesh;
}
// Each quadrant gets an L-shaped sidewalk (one strip facing each of the two
// streets) instead of one giant square slab — this hugs just the buildings
// and the road, leaving no vast open plaza behind the building rows.
const rowLength = CITY_SIZE - STREET_HALF_WIDTH;
[-1, 1].forEach((sx) => {
  [-1, 1].forEach((sz) => {
    // strip facing the horizontal (X) street: long in X, shallow in Z
    addSidewalkBlock(
      sx * (STREET_HALF_WIDTH + rowLength / 2),
      sz * (STREET_HALF_WIDTH + SIDEWALK_DEPTH / 2),
      rowLength, SIDEWALK_DEPTH
    );
    // strip facing the vertical (Z) street: shallow in X, long in Z
    addSidewalkBlock(
      sx * (STREET_HALF_WIDTH + SIDEWALK_DEPTH / 2),
      sz * (STREET_HALF_WIDTH + rowLength / 2),
      SIDEWALK_DEPTH, rowLength
    );
  });
});

// --- Buildings loaded from the Kenney "City Kit (Commercial)" pack (CC0) ---
const BUILDING_FILES = [
  'building-a.glb', 'building-b.glb', 'building-c.glb', 'building-d.glb',
  'building-e.glb', 'building-f.glb', 'building-g.glb', 'building-h.glb',
  'building-i.glb', 'building-j.glb', 'building-k.glb', 'building-l.glb',
  'building-skyscraper-a.glb', 'building-skyscraper-b.glb',
  'building-skyscraper-c.glb', 'building-skyscraper-d.glb',
];
const cityLoader = new GLTFLoader();
const buildingCache = {};
const colliders = []; // { minX, maxX, minZ, maxZ } world-space AABBs the player can't walk through

const MODEL_SUBDIR = { city: 'GLB format', nature: 'GLTF format' };
function loadBuildingModel(file, dir = 'city') {
  const key = dir + '/' + file;
  if (buildingCache[key]) return buildingCache[key];
  const p = new Promise((resolve) => {
    cityLoader.load(
      `./assets/${dir}/Models/${MODEL_SUBDIR[dir]}/${file}`,
      (gltf) => resolve(gltf.scene),
      undefined,
      () => resolve(null)
    );
  });
  buildingCache[key] = p;
  return p;
}

async function placeBuilding(file, x, z, rotationY, scale) {
  const template = await loadBuildingModel(file);
  if (!template) return;
  const instance = template.clone(true);
  instance.traverse((obj) => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });
  instance.rotation.y = rotationY;
  instance.scale.setScalar(scale);
  instance.position.set(x, 0, z);
  scene.add(instance);

  const box = new THREE.Box3().setFromObject(instance);
  const margin = 0.3; // slight buffer so the player doesn't clip corners
  colliders.push({
    minX: box.min.x + margin, maxX: box.max.x - margin,
    minZ: box.min.z + margin, maxZ: box.max.z - margin,
  });
  return box;
}

// --- Trees & benches (Kenney "Nature Kit", CC0, + a simple procedural bench) ---
const TREE_FILES = ['tree_oak.glb', 'tree_pineTallA.glb', 'tree_detailed.glb', 'tree_fat.glb'];
const TREE_SCALE = 2.2;

function makeBench() {
  const group = new THREE.Group();
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
  const metalMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.5), woodMat);
  seat.position.y = 0.45;
  const back = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.08), woodMat);
  back.position.set(0, 0.7, -0.21);
  group.add(seat, back);
  [-0.6, 0.6].forEach((lx) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.45, 0.45), metalMat);
    leg.position.set(lx, 0.22, 0);
    group.add(leg);
  });
  group.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
  return group;
}

async function placeTree(file, x, z) {
  const template = await loadBuildingModel(file, 'nature');
  if (!template) return;
  const instance = template.clone(true);
  instance.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
  instance.scale.setScalar(TREE_SCALE);
  instance.position.set(x, 0, z);
  instance.rotation.y = Math.random() * Math.PI * 2;
  scene.add(instance);
}

function placeBench(x, z, facingRotY) {
  const bench = makeBench();
  bench.position.set(x, 0, z);
  bench.rotation.y = facingRotY;
  scene.add(bench);
}

// Populates the sidewalk strip between the curb and a building row with
// alternating trees/benches, spaced out and skipping the crosswalk gap
// near the intersection. `fixedAxis`/`fixedSign` say which street edge this
// is (e.g. fixedAxis 'z' = the horizontal street's north/south sidewalk,
// fixedAxis 'x' = the vertical street's east/west sidewalk), so the same
// logic furnishes both streets.
function furnishSidewalk(fixedAxis, fixedSign) {
  const offsetFromCurb = fixedSign * (STREET_HALF_WIDTH + 1.6);
  const facingRotY = fixedAxis === 'z'
    ? (fixedSign > 0 ? Math.PI : 0)
    : (fixedSign > 0 ? -Math.PI / 2 : Math.PI / 2);
  let toggle = 0;
  for (let along = -(CITY_SIZE - 10); along <= CITY_SIZE - 10; along += 6) {
    if (Math.abs(along) < STREET_HALF_WIDTH + 2) continue; // leave the crosswalk clear
    const x = fixedAxis === 'z' ? along : offsetFromCurb;
    const z = fixedAxis === 'z' ? offsetFromCurb : along;
    if (toggle % 3 === 0) {
      placeTree(TREE_FILES[Math.floor(Math.random() * TREE_FILES.length)], x, z);
    } else if (toggle % 3 === 1) {
      placeBench(x, z, facingRotY);
    }
    toggle++;
  }
}

// Buildings are packed shoulder-to-shoulder: each new one is placed right
// against the edge of the previous one instead of on a fixed grid, so mixing
// narrow buildings and wide skyscrapers still looks tightly packed. A small
// negative gap makes them overlap by a hair so there's never a visible seam
// or a slit the player could squeeze through.
const BUILDING_GAP = -0.3;

// Fills one straight row of buildings lining a street edge. `fixedAxis`
// picks which street this row faces ('z' = the horizontal street, so the
// row is packed along X at a fixed Z; 'x' = the vertical street, packed
// along Z at a fixed X). `fixedSign`/`packSign` pick which of the two sides
// of that street, and which direction the row extends from the center.
async function buildRow(fixedAxis, fixedSign, packSign) {
  let fileIndex = Math.floor(Math.random() * BUILDING_FILES.length);
  let offset = ROW_SETBACK;
  const placements = [];
  for (let row = 0; row < ROWS_PER_SIDE; row++) {
    const file = BUILDING_FILES[fileIndex % BUILDING_FILES.length];
    fileIndex++;
    const isSkyscraper = file.includes('skyscraper');
    const half = isSkyscraper ? SKYSCRAPER_HALF_FOOTPRINT : BUILDING_HALF_FOOTPRINT;
    const centerOffset = offset + half;
    const scale = isSkyscraper ? SKYSCRAPER_SCALE : BUILDING_SCALE;

    let x, z, rotY;
    if (fixedAxis === 'z') {
      x = packSign * centerOffset;
      z = fixedSign * ROW_SETBACK;
      rotY = (fixedSign > 0 ? Math.PI : 0) + (packSign < 0 ? Math.PI : 0);
    } else {
      x = fixedSign * ROW_SETBACK;
      z = packSign * centerOffset;
      rotY = (fixedSign > 0 ? -Math.PI / 2 : Math.PI / 2) + (packSign < 0 ? Math.PI : 0);
    }

    placements.push(placeBuilding(file, x, z, rotY, scale));
    offset = centerOffset + half + BUILDING_GAP;
  }
  return Promise.all(placements);
}

// The paved sidewalk is only an L-shaped strip hugging the two streets (see
// SIDEWALK_DEPTH above); beyond it is open grass with nothing in it. Rather
// than let the player wander out there, each quadrant's open interior is
// sealed off with one big invisible collider — same mechanism as a building,
// just without a mesh — so the walkable area stays limited to the road, the
// sidewalk, and the buildings lining it.
function sealQuadrantInterior(signX, signZ) {
  const nearEdge = STREET_HALF_WIDTH + SIDEWALK_DEPTH;
  const farEdge = CITY_SIZE;
  const minX = signX > 0 ? nearEdge : -farEdge;
  const maxX = signX > 0 ? farEdge : -nearEdge;
  const minZ = signZ > 0 ? nearEdge : -farEdge;
  const maxZ = signZ > 0 ? farEdge : -nearEdge;
  colliders.push({ minX, maxX, minZ, maxZ });
}

// Resolves once every building/collider from buildCity() is in place, so
// anything that needs to pick a random *reachable* spot (the quest NPC,
// coin/pill pickups) can wait on the full collider list existing first.
let resolveCityReady;
const cityReady = new Promise((resolve) => { resolveCityReady = resolve; });

async function buildCity() {
  const jobs = [];
  [1, -1].forEach((fixedSign) => {
    [1, -1].forEach((packSign) => {
      jobs.push(buildRow('z', fixedSign, packSign)); // rows facing the horizontal (X) street
      jobs.push(buildRow('x', fixedSign, packSign)); // rows facing the vertical (Z) street
    });
  });
  await Promise.all(jobs);

  furnishSidewalk('z', 1);
  furnishSidewalk('z', -1);
  furnishSidewalk('x', 1);
  furnishSidewalk('x', -1);

  [1, -1].forEach((sx) => [1, -1].forEach((sz) => sealQuadrantInterior(sx, sz)));

  placeParkedCars();
  initPickups();

  resolveCityReady();
}
buildCity();

// --- Reachability helpers ---
// A point is "reachable" if it isn't inside any collider (buildings, the
// sealed-off quadrant interiors, parked cars) and is within the paved city
// bounds. Used to scatter the quest NPC and pickups only where the player
// can actually walk.
function isReachable(x, z, margin) {
  if (Math.abs(x) > CITY_SIZE - 2 || Math.abs(z) > CITY_SIZE - 2) return false;
  return !colliders.some((c) =>
    x + margin > c.minX && x - margin < c.maxX &&
    z + margin > c.minZ && z - margin < c.maxZ
  );
}

function getRandomReachablePosition(margin = 0.6, avoid = null) {
  for (let i = 0; i < 300; i++) {
    const x = (Math.random() * 2 - 1) * (CITY_SIZE - 2);
    const z = (Math.random() * 2 - 1) * (CITY_SIZE - 2);
    if (avoid && Math.hypot(x - avoid.x, z - avoid.z) < avoid.radius) continue;
    if (isReachable(x, z, margin)) return { x, z };
  }
  return { x: 0, z: STREET_HALF_WIDTH + 2 }; // fallback: just off the spawn crosswalk
}

// --- Cars (simple procedural models — body + tinted cabin + wheels) ---
const CAR_COLORS = [0xd0392b, 0x2f6fd0, 0xd8c22f, 0x39a24a, 0xe8e8e8, 0x2b2b2b, 0xd06fbb];
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.7, 3.6),
    new THREE.MeshStandardMaterial({ color })
  );
  body.position.y = 0.55;
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.5, 1.8),
    new THREE.MeshStandardMaterial({ color: 0x9fd0ea, transparent: true, opacity: 0.7 })
  );
  cabin.position.set(0, 1.0, -0.2);
  g.add(body, cabin);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[-0.95, 1.2], [0.95, 1.2], [-0.95, -1.2], [0.95, -1.2]].forEach(([x, z]) => {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.3, 12), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.35, z);
    g.add(wheel);
  });
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// Parked cars sit right at the curb (on the road, not the sidewalk) all
// along both streets, and double as regular colliders so the player can't
// walk through them. Kept well outside the moving-traffic lane (see
// MOVING_LANES below) so through-traffic never overlaps them.
const PARKED_LANE_OFFSET = STREET_HALF_WIDTH - 1.3; // ~3.7, hugs the curb
function placeParkedCars() {
  const laneOffset = PARKED_LANE_OFFSET;
  const halfLen = 1.9, halfWid = 1.0;
  const addParked = (x, z, axis, rotY) => {
    const car = makeCar(CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
    car.position.set(x, 0, z);
    car.rotation.y = rotY;
    scene.add(car);
    const hx = axis === 'x' ? halfLen : halfWid;
    const hz = axis === 'x' ? halfWid : halfLen;
    colliders.push({ minX: x - hx, maxX: x + hx, minZ: z - hz, maxZ: z + hz });
  };
  [1, -1].forEach((sz) => {
    for (let x = -(CITY_SIZE - 20); x <= CITY_SIZE - 20; x += 22) {
      if (Math.abs(x) < STREET_HALF_WIDTH + 4) continue;
      if (Math.random() < 0.4) continue;
      // Car body's long axis is local Z, so it needs a 90° turn to lie
      // parallel to a street that runs along X (this is what was wrong —
      // it was left facing across the road instead of along it).
      addParked(x, sz * laneOffset, 'x', Math.PI / 2);
    }
  });
  [1, -1].forEach((sx) => {
    for (let z = -(CITY_SIZE - 20); z <= CITY_SIZE - 20; z += 22) {
      if (Math.abs(z) < STREET_HALF_WIDTH + 4) continue;
      if (Math.random() < 0.4) continue;
      addParked(sx * laneOffset, z, 'z', 0);
    }
  });
}

// --- Moving traffic ---
// Four one-way lanes (both directions on each of the two streets), each
// looping cars from one edge of the city to the other. Kept closer to the
// street's centerline than PARKED_LANE_OFFSET so through-traffic never
// shares a line with the parked cars hugging the curb.
// Needs to clear PARKED_LANE_OFFSET by more than the two cars' combined
// cross-axis half-widths (~2.2) — otherwise a moving car passing a parked
// one would register as a collision (blocked forever) even though they're
// meant to be in separate lanes.
const MOVING_LANE_OFFSET = STREET_HALF_WIDTH - 3.7; // ~1.3
const MOVING_LANES = [
  { axis: 'x', cross: MOVING_LANE_OFFSET, dir: 1 },
  { axis: 'x', cross: -MOVING_LANE_OFFSET, dir: -1 },
  { axis: 'z', cross: MOVING_LANE_OFFSET, dir: 1 },
  { axis: 'z', cross: -MOVING_LANE_OFFSET, dir: -1 },
];
const movingCars = [];
const CAR_HIT_RADIUS = 2.0;
const CAR_DAMAGE = 10;
const CAR_HIT_INVULN = 1.0; // seconds, matches the knockback cooldown
const CAR_HALF_LEN = 1.9, CAR_HALF_WID = 1.0;

function spawnMovingCars(perLane = 3) {
  MOVING_LANES.forEach((lane) => {
    for (let i = 0; i < perLane; i++) {
      const mesh = makeCar(CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
      const along = -CITY_SIZE + (i / perLane) * CITY_SIZE * 2 + Math.random() * 10;
      if (lane.axis === 'x') {
        mesh.position.set(along, 0, lane.cross);
        mesh.rotation.y = lane.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
      } else {
        mesh.position.set(lane.cross, 0, along);
        mesh.rotation.y = lane.dir > 0 ? 0 : Math.PI;
      }
      scene.add(mesh);
      movingCars.push({ mesh, lane, speed: 9 + Math.random() * 5 });
    }
  });
}
spawnMovingCars();

// AABB for a car centered at (x, z), accounting for which way it's facing
// (its long axis is local Z, so a car driving along world X needs its
// bounding box's long side on X instead). `margin` inflates it slightly so
// cars keep a small gap rather than touching bumper-to-bumper.
function carAABBAt(x, z, axis, margin = 0.2) {
  const halfLen = CAR_HALF_LEN + margin, halfWid = CAR_HALF_WID + margin;
  const hx = axis === 'x' ? halfLen : halfWid;
  const hz = axis === 'x' ? halfWid : halfLen;
  return { minX: x - hx, maxX: x + hx, minZ: z - hz, maxZ: z + hz };
}
function aabbOverlap(a, b) {
  return a.minX < b.maxX && a.maxX > b.minX && a.minZ < b.maxZ && a.maxZ > b.minZ;
}

function updateTraffic(delta) {
  movingCars.forEach((car) => {
    const { mesh, lane, speed } = car;
    const moveDist = speed * delta;
    let nextX = mesh.position.x, nextZ = mesh.position.z;
    if (lane.axis === 'x') nextX += lane.dir * moveDist;
    else nextZ += lane.dir * moveDist;

    const nextBox = carAABBAt(nextX, nextZ, lane.axis);
    // Only checked against static colliders (buildings/parked cars), not
    // other moving cars: checking moving-vs-moving used to let a couple of
    // cars end up permanently nose-to-tail (most often right near the map
    // edge, just before the wrap-around point), which then blocked every
    // car behind them forever and looked like traffic "getting stuck at the
    // boundary and never spawning again". Cars may now briefly overlap each
    // other, but they never freeze in place.
    const blocked = colliders.some((c) => aabbOverlap(nextBox, c));

    if (!blocked) {
      mesh.position.x = nextX;
      mesh.position.z = nextZ;
    }

    if (mesh.position.x > CITY_SIZE) mesh.position.x = -CITY_SIZE;
    if (mesh.position.x < -CITY_SIZE) mesh.position.x = CITY_SIZE;
    if (mesh.position.z > CITY_SIZE) mesh.position.z = -CITY_SIZE;
    if (mesh.position.z < -CITY_SIZE) mesh.position.z = CITY_SIZE;
  });
}

function updateTrafficCollisions() {
  if (!character) return;
  for (const { mesh } of movingCars) {
    const dx = character.position.x - mesh.position.x;
    const dz = character.position.z - mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < CAR_HIT_RADIUS) {
      const now = clock.elapsedTime;
      if (now - lastHitTime < CAR_HIT_INVULN) continue;
      lastHitTime = now;
      takeDamage(CAR_DAMAGE);
      const pushX = dist > 0.001 ? dx / dist : 1;
      const pushZ = dist > 0.001 ? dz / dist : 0;
      startKnockback(pushX, pushZ);
      break;
    }
  }
}

// --- Coin & pill pickups ---
function makeCoin() {
  const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, 0.08, 20),
    new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.7, roughness: 0.25, emissive: 0x553c00, emissiveIntensity: 0.4 })
  );
  coin.rotation.x = Math.PI / 2;
  coin.castShadow = true;
  return coin;
}
function makePill() {
  const g = new THREE.Group();
  const half = new THREE.MeshStandardMaterial({ color: 0xff8c1a });
  const otherHalf = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const capsule = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.45, 4, 10), half);
  capsule.rotation.z = Math.PI / 2;
  g.add(capsule);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeReceipt() {
  const g = new THREE.Group();
  const paper = new THREE.Mesh(
    new THREE.BoxGeometry(0.42, 0.03, 0.58),
    new THREE.MeshStandardMaterial({ color: 0xfafafa })
  );
  const clip = new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.02, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x3fa0e0 })
  );
  clip.position.set(0, 0.02, -0.22);
  g.add(paper, clip);
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const pickups = []; // { mesh, type: 'coin' | 'pill' | 'receipt' }
function spawnPickup(type) {
  const mesh = type === 'coin' ? makeCoin() : type === 'pill' ? makePill() : makeReceipt();
  const pos = getRandomReachablePosition(0.6);
  mesh.position.set(pos.x, type === 'coin' ? 0.5 : type === 'pill' ? 0.6 : 0.4, pos.z);
  scene.add(mesh);
  pickups.push({ mesh, type });
}

const COIN_COUNT = 18;
const PILL_COUNT = 10;
const PICKUP_RADIUS = 1.1;
function initPickups() {
  for (let i = 0; i < COIN_COUNT; i++) spawnPickup('coin');
  for (let i = 0; i < PILL_COUNT; i++) spawnPickup('pill');
}

// "我要報帳" quest progress — how many of the 10 scattered receipts have
// been picked up so far. Receipts don't respawn once collected (unlike
// coins/pills), since they're a fixed one-time collection target.
let receiptCount = 0;
const RECEIPT_TARGET = 10;

function updatePickups(delta) {
  if (!character) return;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.mesh.rotation.y += delta * 2.2;
    const dx = character.position.x - p.mesh.position.x;
    const dz = character.position.z - p.mesh.position.z;
    if (Math.hypot(dx, dz) > PICKUP_RADIUS) continue;

    if (p.type === 'coin') {
      addMoney(10);
    } else if (p.type === 'pill') {
      if (hp >= 100) continue; // full health — leave the pill for later
      heal(10);
    } else if (p.type === 'receipt') {
      receiptCount++;
      renderQuestPanel();
      scene.remove(p.mesh);
      pickups.splice(i, 1);
      if (receiptCount >= RECEIPT_TARGET) {
        gameState = 'questComplete'; // freezes input until confirmed
        showFoundOverlay('📋 收集齊全！', '找到 Julie 交付報帳收據吧！', () => startJulieDeliverPhase());
      }
      continue;
    }
    const pos = getRandomReachablePosition(0.6);
    p.mesh.position.x = pos.x;
    p.mesh.position.z = pos.z;
  }
}

// --- Quest system ---
// A small generic quest list so more quests can be added later without
// rewriting this panel. Each quest starts 'available' and only does
// anything once the player clicks it to accept — nothing quest-related
// (like the NPC actually appearing) happens before that. The `quests`
// object itself, and the "尋找 Julie" chain that grows out of it, is
// defined further down (see checkQuestProgress and friends).

function renderQuestPanel() {
  const list = document.getElementById('questList');
  list.innerHTML = '';
  Object.entries(quests).forEach(([id, q]) => {
    const row = document.createElement('div');
    row.className = `quest-row quest-${q.state}`;
    const icon = q.state === 'completed' ? '✅' : q.state === 'active' ? '🔸' : '⬜';
    const hint = q.state === 'available' ? '點擊接受任務' : (typeof q.hint === 'function' ? q.hint() : (q.hint || ''));
    row.innerHTML = `${icon} ${q.title}<span class="quest-hint">${hint}</span>`;
    if (q.state === 'available') {
      row.addEventListener('click', () => beginQuestIntro(id));
    }
    list.appendChild(row);
  });
}

function acceptQuest(id) {
  const q = quests[id];
  if (!q || q.state !== 'available') return;
  q.state = 'active';
  renderQuestPanel();
  if (q.onAccept) q.onAccept();
}

function completeQuest(id) {
  quests[id].state = 'completed';
  renderQuestPanel();
}

// --- Generic dialog cutscene ---
// Used for (a) accepting a quest from the panel and (b) mid-quest story
// beats (Julie/Gloria speaking). In both cases the camera swings to whoever
// is speaking (`cutsceneTarget` — the player character or an NPC), shows a
// dialog with an optional portrait, holds until confirmed, then swings back
// to the normal gameplay camera. Movement is frozen throughout since none
// of the intermediate gameState values here are 'playing'.
const CUTSCENE_CAM_DURATION = 0.6;
let cutsceneStart = 0;
let cutsceneTarget = null;
let dialogMode = null; // 'accept' | 'story'
let pendingQuestId = null;
let pendingConfirm = null;
let pendingDialogTitle = '', pendingDialogText = '', pendingPortraitModel = null, pendingPortraitRotY = 0.4;
let pendingHintModel = null, pendingHintRotY = 0.4, pendingHintLabel = '';

// Camera position/lookAt for framing an arbitrary actor's face — same
// convention as the character's own front view (rest pose faces +Z), but
// rotated by the actor's current facing so it works for NPCs too.
function getTargetFrontCamPos(actor) {
  return actor.position.clone().add(new THREE.Vector3(0, 1.6, 3.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), actor.rotation.y));
}
function getTargetFrontLookAt(actor) {
  return actor.position.clone().add(new THREE.Vector3(0, 1.5, 0));
}

function beginDialogCutscene(target, title, text, portraitModel, mode, onConfirm, portraitRotY = 0.4, hintModel = null, hintRotY = 0.4, hintLabel = '') {
  if (gameState !== 'playing' || !character || !target) return;
  cutsceneTarget = target;
  dialogMode = mode;
  pendingConfirm = onConfirm || null;
  pendingDialogTitle = title;
  pendingDialogText = text;
  pendingPortraitModel = portraitModel || null;
  pendingPortraitRotY = portraitRotY;
  pendingHintModel = hintModel || null;
  pendingHintRotY = hintRotY;
  pendingHintLabel = hintLabel;
  gameState = 'dialogCamIn';
  cutsceneStart = clock.elapsedTime;
}

function beginQuestIntro(id) {
  const q = quests[id];
  if (!q || q.state !== 'available' || gameState !== 'playing' || !character) return;
  pendingQuestId = id;
  const portraitModel = id === 'findJulie' ? npcPortraitSource : id === 'findGloria' ? gloriaPortraitSource : id === 'reportReceipts' ? makeReceipt() : null;
  beginDialogCutscene(character, q.title, q.description, portraitModel, 'accept', null);
}

function updateDialogCinematic() {
  if (gameState === 'dialogCamIn') {
    const t = Math.min(1, (clock.elapsedTime - cutsceneStart) / CUTSCENE_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getGameplayCamPos(), getTargetFrontCamPos(cutsceneTarget), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getGameplayLookAt(), getTargetFrontLookAt(cutsceneTarget), e));
    if (t >= 1) {
      document.getElementById('questDialogTitle').textContent = pendingDialogTitle;
      document.getElementById('questDialogText').textContent = pendingDialogText;
      const canvas = document.getElementById('questPortrait');
      if (pendingPortraitModel) {
        canvas.style.display = 'block';
        renderPortraitOf(pendingPortraitModel, pendingPortraitRotY);
      } else {
        canvas.style.display = 'none';
      }
      const hintBox = document.getElementById('questHintBox');
      if (pendingHintModel) {
        hintBox.style.display = 'block';
        document.getElementById('questHintLabel').textContent = pendingHintLabel;
        renderHintPortraitOf(pendingHintModel, pendingHintRotY);
      } else {
        hintBox.style.display = 'none';
      }
      document.getElementById('questIntroDialog').style.display = 'block';
      gameState = 'dialogHold';
    }
  } else if (gameState === 'dialogHold') {
    // Holds here (no auto-timeout) until the confirm button is clicked.
    camera.position.copy(getTargetFrontCamPos(cutsceneTarget));
    camera.lookAt(getTargetFrontLookAt(cutsceneTarget));
  } else if (gameState === 'dialogCamOut') {
    const t = Math.min(1, (clock.elapsedTime - cutsceneStart) / CUTSCENE_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getTargetFrontCamPos(cutsceneTarget), getGameplayCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getTargetFrontLookAt(cutsceneTarget), getGameplayLookAt(), e));
    if (t >= 1) {
      gameState = 'playing';
      cutsceneTarget = null;
    }
  }
}

// --- Quest NPCs: Julie & Gloria ---
// Both models load in the background as soon as the page does (they're
// large files), but neither is placed in the world or tracked for a quest
// until the player actually accepts the relevant quest from the panel.
const npcMixers = [];

function loadNPC(path, targetHeight = 1.8) {
  return new Promise((resolve) => {
    const ldr = new GLTFLoader();
    ldr.load(
      path,
      (gltf) => {
        const m = gltf.scene;
        m.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
          }
        });
        const box = new THREE.Box3().setFromObject(m);
        const size = new THREE.Vector3();
        box.getSize(size);
        m.scale.setScalar(targetHeight / (size.y || 1));
        const box2 = new THREE.Box3().setFromObject(m);
        m.position.y -= box2.min.y;

        // A pristine, never-animated clone taken right after load (before
        // any mixer advances) — portraits always render from this instead
        // of the live `m`, otherwise an idle/look-around clip can leave the
        // head bone turned away from the portrait camera at whatever random
        // moment the dialog happens to open, making the face intermittently
        // disappear behind hair for reasons that have nothing to do with
        // the deliberate rotationY framing.
        const portraitSource = cloneSkinned(m);

        const mixers = [];
        if (gltf.animations && gltf.animations.length > 0) {
          const mx = new THREE.AnimationMixer(m);
          mx.clipAction(gltf.animations[0]).play();
          mixers.push(mx);
        }
        resolve({ model: m, mixers, portraitSource });
      },
      undefined,
      (err) => { console.error('Failed to load NPC model', path, err); resolve(null); }
    );
  });
}

let npc = null;
let npcPortraitSource = null;
let resolveNpcReady;
const npcReady = new Promise((resolve) => { resolveNpcReady = resolve; });
loadNPC('./model/julie.glb').then((res) => {
  if (res) { npc = res.model; npcPortraitSource = res.portraitSource; npcMixers.push(...res.mixers); }
  resolveNpcReady();
});

let gloria = null;
let gloriaPortraitSource = null;
let resolveGloriaReady;
const gloriaReady = new Promise((resolve) => { resolveGloriaReady = resolve; });
loadNPC('./model/gloria.glb').then((res) => {
  if (res) { gloria = res.model; gloriaPortraitSource = res.portraitSource; npcMixers.push(...res.mixers); }
  resolveGloriaReady();
});

// A tiny standalone scene + renderer just for the head-and-shoulders
// portrait shown in dialogs — a fresh SkeletonUtils clone of whichever
// actor is speaking, so it's independent of that actor's (possibly
// off-screen / not-yet-spawned) position in the main world. A plain
// .clone(true) doesn't rebind a SkinnedMesh's skeleton, which leaves it
// collapsed/invisible — SkeletonUtils' clone() handles that.
function createPortraitRig(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(size, size);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
  dirLight.position.set(1, 2, 3);
  scene.add(dirLight);
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 10);
  return { renderer, scene, camera };
}

let mainPortraitRig = null, hintPortraitRig = null;
function setupPortraitRig() {
  mainPortraitRig = createPortraitRig('questPortrait', 120);
  hintPortraitRig = createPortraitRig('questHintPortrait', 70);
}
setupPortraitRig();

function renderIntoRig(rig, sourceModel, rotationY = 0.4) {
  if (!rig || !sourceModel) return;
  const clone = cloneSkinned(sourceModel);
  clone.position.set(0, 0, 0);
  clone.rotation.y = rotationY; // slight turn; camera sits on the model's rest-facing (+Z) side
  // Fully metallic materials (e.g. some scanned models) render almost black
  // under this scene's simple hemisphere + directional lights since there's
  // no environment map to reflect — clone the material and cap metalness
  // just for the portrait so the face is actually visible.
  clone.traverse((o) => {
    if (o.isMesh && o.material) {
      const mats = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
      o.material = mats;
      (Array.isArray(mats) ? mats : [mats]).forEach((m) => {
        if ('metalness' in m) m.metalness = Math.min(m.metalness, 0.15);
      });
    }
  });
  rig.scene.add(clone);

  // Distance/framing is derived from the model's own footprint rather than
  // a fixed number — a hardcoded z=0.55 worked for human-proportioned
  // models but put the camera *inside* a wider/deeper model (rendering
  // nothing, since you were looking at the inside of its back-culled
  // faces). Tall-and-narrow models (people) get a tight head-and-shoulders
  // crop; anything wider/flatter (not humanoid, or a small prop like a
  // receipt) gets framed so the whole model fits in view instead of
  // guessing where its "face" is.
  const box = new THREE.Box3().setFromObject(clone);
  const size = new THREE.Vector3();
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);
  const isHumanoid = size.y > size.x * 1.3 && size.y > size.z * 1.3;
  if (isHumanoid) {
    const headY = box.max.y - Math.min(0.14, size.y * 0.1);
    const camDist = Math.max(size.x, size.z) / 2 + 0.35;
    rig.camera.position.set(center.x, headY, center.z + camDist);
    rig.camera.lookAt(center.x, headY, center.z);
  } else {
    const sphere = new THREE.Sphere();
    box.getBoundingSphere(sphere);
    const fovRad = THREE.MathUtils.degToRad(rig.camera.fov);
    const camDist = (sphere.radius / Math.sin(fovRad / 2)) * 1.2;
    rig.camera.position.set(sphere.center.x, sphere.center.y, sphere.center.z + camDist);
    rig.camera.lookAt(sphere.center);
  }
  rig.renderer.render(rig.scene, rig.camera);

  rig.scene.remove(clone);
  clone.traverse((o) => {
    if (o.isMesh) {
      o.geometry.dispose();
      (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
    }
  });
}

function renderPortraitOf(sourceModel, rotationY = 0.4) {

function renderHintPortraitOf(sourceModel, rotationY = 0.4) {

// --- NPCs running off after their part of the story is done ---
const runningAwayNpcs = []; // { mesh, dir, speed, life, onDone }
function startRunAway(npcMesh, onDone) {
  const angle = Math.random() * Math.PI * 2;
  runningAwayNpcs.push({
    mesh: npcMesh,
    dir: new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle)),
    speed: 14,
    life: 0,
    onDone: onDone || null,
  });
}
function updateRunningAwayNpcs(delta) {
  for (let i = runningAwayNpcs.length - 1; i >= 0; i--) {
    const r = runningAwayNpcs[i];
    r.mesh.position.addScaledVector(r.dir, r.speed * delta);
    r.mesh.rotation.y = Math.atan2(r.dir.x, r.dir.z);
    r.life += delta;
    if (r.life > 1.2) {
      scene.remove(r.mesh);
      runningAwayNpcs.splice(i, 1);
      if (r.onDone) r.onDone();
    }
  }
}

// --- On-screen quest arrow ---
// Points from the player's current facing toward whatever the active quest
// step wants next — Julie, Gloria, or (while collecting) the nearest
// remaining receipt — so the player doesn't have to wander the city blind.
function getCurrentQuestTargetPos() {
  if (npc && julliePhase) return npc.position;
  if (gloria && gloriaPhase === 'seek') return gloria.position;
  if (character && quests.reportReceipts && quests.reportReceipts.state === 'active') {
    let nearest = null;
    let nearestDist = Infinity;
    for (const p of pickups) {
      if (p.type !== 'receipt') continue;
      const d = Math.hypot(character.position.x - p.mesh.position.x, character.position.z - p.mesh.position.z);
      if (d < nearestDist) { nearestDist = d; nearest = p.mesh.position; }
    }
    return nearest;
  }
  return null;
}

function updateQuestArrow() {
  const arrowEl = document.getElementById('questArrow');
  const target = character ? getCurrentQuestTargetPos() : null;
  if (!target) {
    arrowEl.style.display = 'none';
    return;
  }
  const dx = target.x - character.position.x;
  const dz = target.z - character.position.z;
  const dist = Math.hypot(dx, dz);
  const targetAngle = Math.atan2(dx, dz);
  // Relative to the character's own facing (which the gameplay camera is
  // rigidly locked behind), normalized to -180..180 so the icon always
  // rotates the short way around instead of snapping past 180°.
  let rel = targetAngle - character.rotation.y;
  rel = THREE.MathUtils.euclideanModulo(rel + Math.PI, Math.PI * 2) - Math.PI;
  const deg = THREE.MathUtils.radToDeg(rel);

  arrowEl.style.display = 'flex';
  document.getElementById('questArrowIcon').style.transform = `rotate(${deg}deg)`;
  document.getElementById('questArrowDist').textContent = `${Math.round(dist)}m`;
}

function checkQuestProgress() {
  if (npc && character && julliePhase) {
    const dx = character.position.x - npc.position.x;
    const dz = character.position.z - npc.position.z;
    if (Math.hypot(dx, dz) < FOUND_DISTANCE) {
      if (julliePhase === 'seek') {
        julliePhase = null;
        completeQuest('findJulie');
        // Two dialogs in a row before she runs off: "found her" first, then
        // a nudge toward the next quest — she only actually leaves once the
        // SECOND one is dismissed, not before.
        gameState = 'questComplete'; // freezes player/traffic-hit input until confirmed
        showFoundOverlay('🎉 找到了！', '你成功找到了 Julie，任務完成！', () => {
          gameState = 'questComplete';
          showFoundOverlay('📋 下一步', '快去搜集你的收據來報帳吧！', () => {
            startRunAway(npc);
            addReportQuest();
          });
        });
      } else if (julliePhase === 'deliver') {
        julliePhase = null;
        // She turns her back (rotationY = PI, so the portrait shows the
        // back of her head, not her face) while hinting at who to look for
        // next — Gloria's own portrait is shown alongside as a preview.
        // Portraits are cloned from the frozen, never-animated
        // *PortraitSource references (not the live npc/gloria), so an
        // idle animation can't leave the head turned away from the camera.
        beginDialogCutscene(npc, 'Julie', '誒…還缺少機票的收據耶，這個要找 Gloria 拿！', npcPortraitSource, 'story', () => {
          completeQuest('reportReceipts');
          addFindGloriaQuest();
        }, Math.PI, gloriaPortraitSource, 0.4, 'Gloria');
      } else if (julliePhase === 'awaitReturn') {
        julliePhase = 'done';
        beginDialogCutscene(npc, 'Julie', '太好了，謝謝你！這是給你的獎勵！', npcPortraitSource, 'story', () => {
          completeQuest('returnToJulie');
          addMoney(50000);
          triggerMoneyRain();
          startRunAway(npc);
        }, 0.4);
      }
    }
  }
  if (gloria && character && gloriaPhase === 'seek') {
    const dx = character.position.x - gloria.position.x;
    const dz = character.position.z - gloria.position.z;
    if (Math.hypot(dx, dz) < FOUND_DISTANCE) {
      gloriaPhase = null;
      beginDialogCutscene(gloria, 'Gloria', '這是機票收據，快拿去給 Julie 吧！', gloriaPortraitSource, 'story', () => {
        completeQuest('findGloria');
        hasTicket = true;
        startRunAway(gloria);
        addReturnToJulieQuest();
      });
    }
  }
}

// --- HP / money HUD ---
let hp = 100;
let money = 0;
let lastHitTime = -999;

// --- Being hit by a car: sent flying, tumbling in the air, then lands ---
// Movement input is ignored for the duration; position/rotation are driven
// entirely by this instead (see the knockback branch in updateCharacter).
const KNOCKBACK_DURATION = 0.7;
const KNOCKBACK_DIST = 8;
const KNOCKBACK_HEIGHT = 3;
let knockbackTimer = 0;
const knockbackStartPos = new THREE.Vector3();
const knockbackDir = new THREE.Vector3();
const knockbackSpinAxis = new THREE.Vector3(1, 0, 0);
let knockbackSpinSpeed = 0;

function startKnockback(dirX, dirZ) {
  knockbackStartPos.copy(character.position);
  knockbackDir.set(dirX, 0, dirZ);
  knockbackTimer = KNOCKBACK_DURATION;
  // A mostly-horizontal, randomized axis gives a tumbling cartwheel rather
  // than a flat, unnatural spin purely around one axis every time.
  knockbackSpinAxis.set(Math.random() - 0.5, (Math.random() - 0.5) * 0.4, Math.random() - 0.5).normalize();
  knockbackSpinSpeed = (14 + Math.random() * 8) * (Math.random() < 0.5 ? 1 : -1);
}

function updateHUD() {
  document.getElementById('hpBarFill').style.width = Math.max(0, hp) + '%';
  document.getElementById('hpText').textContent = `${Math.round(hp)}/100`;
  document.getElementById('moneyText').textContent = `$${money}`;
}
function takeDamage(amount) {
  hp = Math.max(0, hp - amount);
  updateHUD();
}
function heal(amount) {
  if (hp >= 100) return false;
  hp = Math.min(100, hp + amount);
  updateHUD();
  return true;
}
function addMoney(amount) {
  money += amount;
  updateHUD();
}

// --- Throwing money (灑錢): a short cutscene — camera swings around to the
// character's face, holds for a beat, the money actually leaves (particles
// + the deduction) with a "爹地好開心" caption, then the camera swings back
// and control returns. Player input is frozen throughout because none of
// the intermediate gameState values here are 'playing', which is what
// updateCharacter (and the traffic-hit/pickup checks) gate on.
const MONEY_CAM_DURATION = 0.6;
const MONEY_HOLD_DURATION = 0.4; // + MONEY_CAM_DURATION = ~1s at the face before the throw
const MONEY_DIALOG_DURATION = 1.0;
let moneyStateStart = 0;

function startThrowMoneySequence() {
  if (!character || gameState !== 'playing') return;
  if (money <= 0) return;
  gameState = 'moneyCamIn';
  moneyStateStart = clock.elapsedTime;
}

function updateMoneyCinematic() {
  if (gameState === 'moneyCamIn') {
    const t = Math.min(1, (clock.elapsedTime - moneyStateStart) / MONEY_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getGameplayCamPos(), getFrontViewCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getGameplayLookAt(), getFrontViewLookAt(), e));
    if (t >= 1) {
      gameState = 'moneyHold';
      moneyStateStart = clock.elapsedTime;
    }
  } else if (gameState === 'moneyHold') {
    camera.position.copy(getFrontViewCamPos());
    camera.lookAt(getFrontViewLookAt());
    if (clock.elapsedTime - moneyStateStart >= MONEY_HOLD_DURATION) {
      throwMoney();
      document.getElementById('moneyDialog').style.display = 'block';
      gameState = 'moneyDialog';
      moneyStateStart = clock.elapsedTime;
    }
  } else if (gameState === 'moneyDialog') {
    camera.position.copy(getFrontViewCamPos());
    camera.lookAt(getFrontViewLookAt());
    if (clock.elapsedTime - moneyStateStart >= MONEY_DIALOG_DURATION) {
      document.getElementById('moneyDialog').style.display = 'none';
      gameState = 'moneyCamOut';
      moneyStateStart = clock.elapsedTime;
    }
  } else if (gameState === 'moneyCamOut') {
    const t = Math.min(1, (clock.elapsedTime - moneyStateStart) / MONEY_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getFrontViewCamPos(), getGameplayCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getFrontViewLookAt(), getGameplayLookAt(), e));
    if (t >= 1) {
      gameState = 'playing';
    }
  }
}

// The actual particle burst + deduction, fired partway through the
// cutscene above (see 'moneyHold'). No gameState guard here — the caller
// is responsible for that (startThrowMoneySequence for the player-facing
// entry point).
const THROW_COST = 10;
const moneyParticles = []; // { mesh, velocity, life }
function throwMoney() {
  const amount = Math.min(THROW_COST, money);
  if (amount <= 0) return;
  money -= amount;
  updateHUD();

  const origin = character.position.clone().add(new THREE.Vector3(0, 1.3, 0));
  for (let i = 0; i < 14; i++) {
    const bill = new THREE.Mesh(
      new THREE.PlaneGeometry(0.35, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x3fb552, side: THREE.DoubleSide })
    );
    bill.position.copy(origin);
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.8 + Math.random() * 2.6;
    const velocity = new THREE.Vector3(
      Math.cos(angle) * speed,
      3 + Math.random() * 2.5,
      Math.sin(angle) * speed
    );
    scene.add(bill);
    moneyParticles.push({ mesh: bill, velocity, life: 0 });
  }
}

function updateMoneyParticles(delta) {
  for (let i = moneyParticles.length - 1; i >= 0; i--) {
    const p = moneyParticles[i];
    p.velocity.y -= 9.8 * delta;
    p.mesh.position.addScaledVector(p.velocity, delta);
    p.mesh.rotation.x += delta * 6;
    p.mesh.rotation.y += delta * 4;
    p.life += delta;
    if (p.mesh.position.y < 0.05 || p.life > 1.8) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      moneyParticles.splice(i, 1);
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyF') startThrowMoneySequence();
});

// --- Camera zoom ---
// The gameplay camera is rigidly locked behind the character (see
// updateCharacter's camera step below) — no free mouse-look — so all the
// player can adjust is how far back/high it sits. Scroll wheel scales that
// offset; it never rotates around the character.
let camZoom = 1;
const CAM_ZOOM_MIN = 0.5;
const CAM_ZOOM_MAX = 2.2;
window.addEventListener('wheel', (e) => {
  if (gameState !== 'playing') return;
  camZoom = THREE.MathUtils.clamp(camZoom + Math.sign(e.deltaY) * 0.08, CAM_ZOOM_MIN, CAM_ZOOM_MAX);
}, { passive: true });

// On touch devices, zoom is a dedicated vertical slider (see #zoomSlider)
// instead of a pinch gesture — wired up down in the touch-controls section.

// --- Character ---
// `character` is the root group: it owns world position + facing rotation.
// `model` is the loaded mesh nested inside it: procedural walk-bob/sway/lean
// gets applied only to `model`'s local transform, so it never fights with
// the facing rotation or position logic below.
let character = null;
let model = null;
let modelBaseY = 0;
let hasSkeletalAnimation = false;
let mixer = null;
let actions = {};
let currentAction = null;
const clock = new THREE.Clock();

// Resolves once `character` exists, so the opening cinematic (which needs a
// character position to fly the camera toward) can wait on it even if the
// player mashes START before the model has finished downloading.
let resolveCharacterReady;
const characterReady = new Promise((resolve) => { resolveCharacterReady = resolve; });

const loadingEl = document.getElementById('loading');
const loader = new GLTFLoader();
loader.load(
  './model/character.glb',
  (gltf) => {
    model = gltf.scene;
    model.traverse((obj) => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    // Normalize scale/position based on bounding box
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const height = size.y || 1;
    const targetHeight = 1.8;
    const scale = targetHeight / height;
    model.scale.setScalar(scale);

    // Recompute box after scale to sit on ground
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;
    modelBaseY = model.position.y;

    character = new THREE.Group();
    character.add(model);
    scene.add(character);

    // Animations
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(character);
      gltf.animations.forEach((clip) => {
        actions[clip.name] = mixer.clipAction(clip);
      });
      const names = Object.keys(actions);
      console.log('Available animations:', names);

      // Try to guess idle/walk/run clips by name, else fallback to first clips
      const findByKeyword = (kw) => names.find(n => n.toLowerCase().includes(kw));
      actions.idleName = findByKeyword('idle') || names[0];
      actions.walkName = findByKeyword('walk') || names[Math.min(1, names.length - 1)];
      actions.runName = findByKeyword('run') || actions.walkName;

      playAction(actions.idleName);
      hasSkeletalAnimation = true;
    }

    loadingEl.style.display = 'none';
    resolveCharacterReady();
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      loadingEl.textContent = `載入模型中... ${pct}%`;
    }
  },
  (err) => {
    console.error('Failed to load model', err);
    loadingEl.textContent = '模型載入失敗，請查看主控台';
  }
);

function playAction(name, fade = 0.2) {
  if (!name || !actions[name] || !(actions[name] instanceof THREE.AnimationAction)) return;
  const next = actions[name];
  if (currentAction === next) return;
  next.reset().fadeIn(fade).play();
  if (currentAction) currentAction.fadeOut(fade);
  currentAction = next;
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// --- Touch controls (phones/tablets) ---
// The on-screen buttons just set/clear the same `keys` entries the keyboard
// listeners use, so updateCharacter() doesn't need to know or care which
// input method is driving it.
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function bindHoldButton(id, code) {
  const el = document.getElementById(id);
  const press = (e) => { e.preventDefault(); keys[code] = true; };
  const release = (e) => { e.preventDefault(); keys[code] = false; };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindHoldButton('mcRun', 'ShiftLeft');

// Virtual joystick for movement: dragging the knob sets the same
// forward/back/turn `keys` entries the keyboard uses, based on which
// quadrant of the base the knob is pulled toward. A dead zone near the
// center keeps small jitters from the player's thumb from as being read as
// input.
(function setupJoystick() {
  const base = document.getElementById('joystickBase');
  const knob = document.getElementById('joystickKnob');
  const maxRadius = 45; // px the knob can travel from center
  const deadZone = 0.3; // fraction of maxRadius before a direction "activates"
  let activePointerId = null;

  function clearMoveKeys() {
    keys['KeyW'] = false;
    keys['KeyS'] = false;
    keys['KeyA'] = false;
    keys['KeyD'] = false;
  }

  function updateFromPointer(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, maxRadius);
    if (dist > 0) {
      dx = (dx / dist) * clamped;
      dy = (dy / dist) * clamped;
    }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;

    const nx = dx / maxRadius, ny = dy / maxRadius; // normalized -1..1
    keys['KeyW'] = ny < -deadZone;
    keys['KeyS'] = ny > deadZone;
    keys['KeyA'] = nx < -deadZone;
    keys['KeyD'] = nx > deadZone;
  }

  function reset() {
    activePointerId = null;
    knob.style.transform = 'translate(0px, 0px)';
    clearMoveKeys();
  }

  base.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    activePointerId = e.pointerId;
    updateFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    e.preventDefault();
    updateFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    reset();
  });
  window.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== activePointerId) return;
    reset();
  });
})();
document.getElementById('mcThrow').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  startThrowMoneySequence();
});

// Dedicated vertical zoom slider for touch, replacing pinch-to-zoom — same
// camZoom variable the desktop scroll wheel drives.
document.getElementById('zoomSlider').addEventListener('input', (e) => {
  camZoom = parseFloat(e.target.value);
});

// Help panel: a "？" button toggles a small popup with the controls
// (its text is filled in once gameplay starts — see updateCinematicCamera's
// 'transitioning' branch — since it depends on whether this is a touch
// device or not).
document.getElementById('helpBtn').addEventListener('click', () => {
  const panel = document.getElementById('helpPanel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
});

let walkCycle = 0;

// Procedural fake-walk for models with no skeleton/animation: bobs, sways
// and leans the whole mesh in a stepping rhythm so it doesn't look like it's
// gliding, since there's no rig to animate individual limbs.
function applyProceduralWalk(delta, isMoving, running) {
  if (!model || hasSkeletalAnimation) return;

  const cycleSpeed = running ? 10 : 6;
  const bobHeight = running ? 0.12 : 0.07;
  const swayAmount = running ? 0.09 : 0.05;
  const leanAmount = running ? 0.18 : 0.08;

  if (isMoving) {
    walkCycle += delta * cycleSpeed;
  } else {
    // ease back to neutral pose
    walkCycle += (Math.round(walkCycle / Math.PI) * Math.PI - walkCycle) * Math.min(1, delta * 6);
  }

  const bounce = isMoving ? Math.abs(Math.sin(walkCycle)) * bobHeight : 0;
  const sway = isMoving ? Math.sin(walkCycle) * swayAmount : 0;

  model.position.y = modelBaseY + bounce;
  model.rotation.z = sway;
  const targetLean = isMoving ? THREE.MathUtils.degToRad(leanAmount * 10) : 0;
  model.rotation.x = THREE.MathUtils.lerp(model.rotation.x, targetLean, Math.min(1, delta * 8));
}

const PLAYER_RADIUS = 0.35;

// Moves the character by (dx, dz), sliding along building walls instead of
// stopping dead: each axis is tested and applied independently against the
// AABB colliders pushed by placeBuilding().
function tryMove(dx, dz) {
  const p = character.position;
  const collides = (x, z) => colliders.some(c =>
    x + PLAYER_RADIUS > c.minX && x - PLAYER_RADIUS < c.maxX &&
    z + PLAYER_RADIUS > c.minZ && z - PLAYER_RADIUS < c.maxZ
  );
  if (!collides(p.x + dx, p.z)) p.x += dx;
  if (!collides(p.x, p.z + dz)) p.z += dz;
}

// The sidewalk sits `sidewalkThickness` above the road like a real curb.
// Returns how high the ground is under (x, z) so the character can step up
// onto it instead of being visually buried up to the ankles. Matches the
// L-shaped sidewalk strips built in buildCity: a thin band hugging each
// street, not a full quadrant square.
function groundHeightAt(x, z) {
  const inHorizontalStrip = Math.abs(z) > STREET_HALF_WIDTH && Math.abs(z) < STREET_HALF_WIDTH + SIDEWALK_DEPTH;
  const inVerticalStrip = Math.abs(x) > STREET_HALF_WIDTH && Math.abs(x) < STREET_HALF_WIDTH + SIDEWALK_DEPTH;
  const onSidewalk = inHorizontalStrip || inVerticalStrip;
  return onSidewalk ? sidewalkThickness : 0;
}

function updateCharacter(delta) {
  if (!character || gameState !== 'playing') return;

  if (knockbackTimer > 0) {
    // Flying through the air from a car hit: position and the model's tilt
    // are driven entirely by the knockback arc, ignoring WASD until it
    // finishes and the character lands.
    knockbackTimer = Math.max(0, knockbackTimer - delta);
    const t = 1 - knockbackTimer / KNOCKBACK_DURATION;
    const eased = 1 - Math.pow(1 - t, 2); // ease-out: fast launch, slowing before landing
    character.position.x = knockbackStartPos.x + knockbackDir.x * KNOCKBACK_DIST * eased;
    character.position.z = knockbackStartPos.z + knockbackDir.z * KNOCKBACK_DIST * eased;
    character.position.y = knockbackStartPos.y + Math.sin(Math.min(1, t) * Math.PI) * KNOCKBACK_HEIGHT;
    if (model) model.rotateOnAxis(knockbackSpinAxis, knockbackSpinSpeed * delta);

    if (knockbackTimer === 0 && model) {
      // Landed — clear the tumble so it doesn't stay mid-spin into the idle pose.
      model.rotation.set(0, 0, 0);
      model.position.y = modelBaseY;
    }
  } else {
    const walkSpeed = 2.5;
    const runSpeed = 8.5;
    const turnSpeed = 3; // radians/sec, tank-style A/D turning

    const forwardHeld = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
    const backHeld = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
    const turnLeftHeld = (keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0;
    const turnRightHeld = (keys['KeyD'] || keys['ArrowRight']) ? 1 : 0;
    const running = keys['ShiftLeft'] || keys['ShiftRight'];

    // Tank-style controls: A/D turn the character in place, W/S move along
    // however it's currently facing. This sidesteps the strafe-relative-to-
    // its-own-facing scheme tried earlier — turning the character to face its
    // resultant strafe direction while that direction is itself defined
    // relative to the character's current facing is a moving target (the
    // "target" heading is always 90° away from wherever the character
    // currently is), so it never converges and just spins in place forever.
    // Turning explicitly via A/D has no such feedback loop.
    const turnInput = turnRightHeld - turnLeftHeld;
    if (turnInput !== 0) {
      character.rotation.y -= turnInput * turnSpeed * delta;
    }

    const moveInput = forwardHeld - backHeld;
    const isMoving = moveInput !== 0;

    if (isMoving) {
      const facingAngle = character.rotation.y;
      const forward = new THREE.Vector3(Math.sin(facingAngle), 0, Math.cos(facingAngle));

      const speed = running ? runSpeed : walkSpeed;
      tryMove(forward.x * moveInput * speed * delta, forward.z * moveInput * speed * delta);

      if (actions.walkName) {
        playAction(running ? actions.runName : actions.walkName);
      }
    } else {
      if (actions.idleName) playAction(actions.idleName);
    }

    // Step the character up onto the raised sidewalk curb (or back down onto
    // the road) instead of leaving it sunk to its ankles in the pavement.
    const targetGroundY = groundHeightAt(character.position.x, character.position.z);
    character.position.y = THREE.MathUtils.lerp(character.position.y, targetGroundY, Math.min(1, delta * 12));

    applyProceduralWalk(delta, isMoving, running);
  }

  // Camera stays rigidly behind the character: the offset is defined in the
  // character's own local space (0, height, distance) and rotated by its
  // current facing, so turning left/right (via movement, above) swings the
  // camera around with it instead of leaving it to free mouse-look. Only
  // camZoom (scroll wheel) scales how far back/up it sits.
  // Base offset is (0, height, -distance): with rotation.y = 0 the character
  // faces +Z (its rest pose), so -Z is directly behind it.
  const behindOffset = new THREE.Vector3(0, 3, -6).multiplyScalar(camZoom)
    .applyAxisAngle(new THREE.Vector3(0, 1, 0), character.rotation.y);
  const desiredCamPos = character.position.clone().add(behindOffset);
  camera.position.lerp(desiredCamPos, Math.min(1, delta * 8));
  camera.lookAt(character.position.clone().add(new THREE.Vector3(0, 1.4, 0)));
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Opening cinematic: START button -> top-down-to-face camera fly-in ->
// confirm dialog -> normal gameplay camera. `gameState` gates both input
// (updateCharacter only runs once 'playing') and which camera code drives
// the camera each frame, so the scripted cinematic and OrbitControls never
// fight over camera.position in the same frame.
let gameState = 'start'; // 'start' | 'intro' | 'dialog' | 'transitioning' | 'playing'
const topDownCamPos = camera.position.clone(); // (0, 260, 0.01), set above
const topDownLookAt = new THREE.Vector3(0, 0, 0);
const INTRO_DURATION = 3.2;
const TRANSITION_DURATION = 0.7;
let introStart = 0;
let transitionStart = 0;

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// The character's rest pose (rotation.y = 0, before any movement has turned
// it) faces +Z, so "front view" — looking at its face — puts the camera on
// the +Z side looking back toward -Z.
function getFrontViewCamPos() { return character.position.clone().add(new THREE.Vector3(0, 1.6, 3.2)); }
function getFrontViewLookAt() { return character.position.clone().add(new THREE.Vector3(0, 1.5, 0)); }
function getGameplayCamPos() { return character.position.clone().add(new THREE.Vector3(0, 3, -6)); }
function getGameplayLookAt() { return character.position.clone().add(new THREE.Vector3(0, 1.4, 0)); }

function updateCinematicCamera() {
  if (gameState === 'intro') {
    const t = Math.min(1, (clock.elapsedTime - introStart) / INTRO_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(topDownCamPos, getFrontViewCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(topDownLookAt, getFrontViewLookAt(), e));
    if (t >= 1) {
      gameState = 'dialog';
      document.getElementById('dialogBox').style.display = 'block';
    }
  } else if (gameState === 'transitioning') {
    const t = Math.min(1, (clock.elapsedTime - transitionStart) / TRANSITION_DURATION);
    const e = easeInOutCubic(t);
    const endLookAt = getGameplayLookAt();
    camera.position.lerpVectors(getFrontViewCamPos(), getGameplayCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getFrontViewLookAt(), endLookAt, e));
    if (t >= 1) {
      gameState = 'playing';
      document.getElementById('questPanel').style.display = 'block';
      document.getElementById('topRightBar').style.display = 'flex';
      renderQuestPanel();
      updateHUD();
      document.getElementById('helpPanel').innerHTML = isTouchDevice
        ? '左下角搖桿：移動、轉向<br/>右側拉桿：縮放鏡頭<br/>右下角按鈕：跑步、灑錢'
        : 'W / S：前進、後退<br/>A / D：左轉、右轉<br/>Shift：跑步<br/>F：灑錢<br/>滾輪：縮放';
      if (isTouchDevice) {
        document.getElementById('mobileControls').style.display = 'block';
      }
    }
  }
}

window.__dbg = { movingCars, quests };
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = '載入中...';
  await characterReady;
  document.getElementById('startScreen').style.display = 'none';
  introStart = clock.elapsedTime;
  gameState = 'intro';
});

document.getElementById('dialogConfirm').addEventListener('click', () => {
  document.getElementById('dialogBox').style.display = 'none';
  transitionStart = clock.elapsedTime;
  gameState = 'transitioning';
});

// Just dismisses the "found" card and hands control back — the quest stays
// marked completed in the panel, nothing about the run resets. May also
// kick off the next step in a quest chain (see showFoundOverlay callers).
document.getElementById('foundConfirm').addEventListener('click', () => {
  document.getElementById('foundOverlay').style.display = 'none';
  gameState = 'playing';
  const cb = foundOverlayOnConfirm;
  foundOverlayOnConfirm = null;
  if (cb) cb();
});

document.getElementById('questDialogConfirm').addEventListener('click', () => {
  document.getElementById('questIntroDialog').style.display = 'none';
  if (dialogMode === 'accept') {
    const id = pendingQuestId;
    pendingQuestId = null;
    if (id) acceptQuest(id);
  } else if (dialogMode === 'story') {
    const cb = pendingConfirm;
    pendingConfirm = null;
    if (cb) cb();
  }
  cutsceneStart = clock.elapsedTime;
  gameState = 'dialogCamOut';
});

// --- Animate loop ---
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  updateCharacter(delta);
  updateCinematicCamera();
  updateMoneyCinematic();
  updateDialogCinematic();
  if (mixer) mixer.update(delta);
  npcMixers.forEach((m) => m.update(delta));
  updateTraffic(delta);
  updateMoneyParticles(delta);
  updateRunningAwayNpcs(delta);
  if (gameState === 'playing') {
    checkQuestProgress();
    updateTrafficCollisions();
    updatePickups(delta);
    updateQuestArrow();
  } else {
    document.getElementById('questArrow').style.display = 'none';
  }

  renderer.render(scene, camera);
}
animate();
</script>
