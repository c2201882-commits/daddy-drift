// A big burst of bills raining down from above the character — the reward
// for finishing the whole "報帳" quest chain. Reuses moneyParticles'
// physics/cleanup (see updateMoneyParticles), just spawned overhead instead
// of launched outward from the character.
function triggerMoneyRain(count = 70) {
  for (let i = 0; i < count; i++) {
    const bill = new THREE.Mesh(
      new THREE.PlaneGeometry(0.35, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x3fb552, side: THREE.DoubleSide })
    );
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 7;
    bill.position.set(
      character.position.x + Math.cos(angle) * radius,
      10 + Math.random() * 10,
      character.position.z + Math.sin(angle) * radius
    );
    const velocity = new THREE.Vector3((Math.random() - 0.5) * 1.5, -2 - Math.random() * 1.5, (Math.random() - 0.5) * 1.5);
    scene.add(bill);
    moneyParticles.push({ mesh: bill, velocity, life: 0 });
  }
}

// --- On-screen quest arrow ---
// Points from the player's current facing toward whatever the active quest
// step wants next — Julie, Gloria, or (while collecting) the nearest
// remaining receipt — so the player doesn't have to wander the city blind.
function getCurrentQuestTargetPos() {
  if (npc && julliePhase) return npc.position;
  if (gloria && gloriaPhase === 'seek') return gloria.position;
  if (character && quests.reportReceipts && quests.reportReceipts.state === 'active') {
    let nearest = null;
    let nearestDist = Infinity;
    for (const p of pickups) {
      if (p.type !== 'receipt') continue;
      const d = Math.hypot(character.position.x - p.mesh.position.x, character.position.z - p.mesh.position.z);
      if (d < nearestDist) { nearestDist = d; nearest = p.mesh.position; }
    }
    return nearest;
  }
  return null;
}

function updateQuestArrow() {
  const arrowEl = document.getElementById('questArrow');
  const target = character ? getCurrentQuestTargetPos() : null;
  if (!target) {
    arrowEl.style.display = 'none';
    return;
  }
  const dx = target.x - character.position.x;
  const dz = target.z - character.position.z;
  const dist = Math.hypot(dx, dz);
  const targetAngle = Math.atan2(dx, dz);
  // Relative to the character's own facing (which the gameplay camera is
  // rigidly locked behind), normalized to -180..180 so the icon always
  // rotates the short way around instead of snapping past 180°.
  let rel = targetAngle - character.rotation.y;
  rel = THREE.MathUtils.euclideanModulo(rel + Math.PI, Math.PI * 2) - Math.PI;
  const deg = THREE.MathUtils.radToDeg(rel);

  arrowEl.style.display = 'flex';
  document.getElementById('questArrowIcon').style.transform = `rotate(${deg}deg)`;
  document.getElementById('questArrowDist').textContent = `${Math.round(dist)}m`;
}

function checkQuestProgress() {
  if (npc && character && julliePhase) {
    const dx = character.position.x - npc.position.x;
    const dz = character.position.z - npc.position.z;
    if (Math.hypot(dx, dz) < FOUND_DISTANCE) {
      if (julliePhase === 'seek') {
        julliePhase = null;
        completeQuest('findJulie');
        // Two dialogs in a row before she runs off: "found her" first, then
        // a nudge toward the next quest — she only actually leaves once the
        // SECOND one is dismissed, not before.
        gameState = 'questComplete'; // freezes player/traffic-hit input until confirmed
        showFoundOverlay('🎉 找到了！', '你成功找到了 Julie，任務完成！', () => {
          gameState = 'questComplete';
          showFoundOverlay('📋 下一步', '快去搜集你的收據來報帳吧！', () => {
            startRunAway(npc);
            unlockQuest('reportReceipts');
          });
        });
      } else if (julliePhase === 'deliver') {
        julliePhase = null;
        // She turns her back (rotationY = PI, so the portrait shows the
        // back of her head, not her face) while hinting at who to look for
        // next — Gloria's own portrait is shown alongside as a preview.
        // Portraits are cloned from the frozen, never-animated
        // *PortraitSource references (not the live npc/gloria), so an
        // idle animation can't leave the head turned away from the camera.
        beginDialogCutscene(npc, 'Julie', '誒…還缺少機票的收據耶，這個要找 Gloria 拿！', npcPortraitSource, 'story', () => {
          completeQuest('reportReceipts');
          unlockQuest('findGloria');
        }, Math.PI, gloriaPortraitSource, 0.4, 'Gloria');
      } else if (julliePhase === 'awaitReturn') {
        julliePhase = 'done';
        beginDialogCutscene(npc, 'Julie', '太好了，謝謝你！這是給你的獎勵！', npcPortraitSource, 'story', () => {
          completeQuest('returnToJulie');
          addMoney(50000);
          triggerMoneyRain();
          startRunAway(npc);
        }, 0.4);
      }
    }
  }
  if (gloria && character && gloriaPhase === 'seek') {
    const dx = character.position.x - gloria.position.x;
    const dz = character.position.z - gloria.position.z;
    if (Math.hypot(dx, dz) < FOUND_DISTANCE) {
      gloriaPhase = null;
      beginDialogCutscene(gloria, 'Gloria', '這是機票收據，快拿去給 Julie 吧！', gloriaPortraitSource, 'story', () => {
        completeQuest('findGloria');
        hasTicket = true;
        startRunAway(gloria);
        // Skips the accept dialog — it continues straight out of finding
        // Gloria, becoming active immediately rather than sitting in the
        // panel waiting to be clicked.
        unlockQuest('returnToJulie', { state: 'active' });
        julliePhase = 'awaitReturn';
      });
    }
  }
}

// --- HP / money HUD ---
let hp = 100;
let money = 0;
let lastHitTime = -999;

// --- Being hit by a car: sent flying, tumbling in the air, then lands ---
// Movement input is ignored for the duration; position/rotation are driven
// entirely by this instead (see the knockback branch in updateCharacter).
const KNOCKBACK_DURATION = 0.7;
const KNOCKBACK_DIST = 8;
const KNOCKBACK_HEIGHT = 3;
let knockbackTimer = 0;
const knockbackStartPos = new THREE.Vector3();
const knockbackDir = new THREE.Vector3();
const knockbackSpinAxis = new THREE.Vector3(1, 0, 0);
let knockbackSpinSpeed = 0;

function startKnockback(dirX, dirZ) {
  knockbackStartPos.copy(character.position);
  knockbackDir.set(dirX, 0, dirZ);
  knockbackTimer = KNOCKBACK_DURATION;
  // A mostly-horizontal, randomized axis gives a tumbling cartwheel rather
  // than a flat, unnatural spin purely around one axis every time.
  knockbackSpinAxis.set(Math.random() - 0.5, (Math.random() - 0.5) * 0.4, Math.random() - 0.5).normalize();
  knockbackSpinSpeed = (14 + Math.random() * 8) * (Math.random() < 0.5 ? 1 : -1);
}

function updateHUD() {
  document.getElementById('hpBarFill').style.width = Math.max(0, hp) + '%';
  document.getElementById('hpText').textContent = `${Math.round(hp)}/100`;
  document.getElementById('moneyText').textContent = `$${money}`;
}
function takeDamage(amount) {
  if (isHealingEvent) return; // safe while Julie & Gloria are tending to the player
  hp = Math.max(0, hp - amount);
  updateHUD();
  if (hp <= 0 && gameState === 'playing') {
    if (pedestrianHellActive) endPedestrianHell(false);
    else startHealingEvent();
  }
}
function heal(amount) {
  if (hp >= 100) return false;
  hp = Math.min(100, hp + amount);
  updateHUD();
  return true;
}
function addMoney(amount) {
  money += amount;
  updateHUD();
}

// --- 行人地獄 minigame ---
// While active, every car/motorcycle (see updateTraffic/updateMotorcycles)
// abandons its normal lane behavior and beelines straight for the player
// instead. Survive PEDESTRIAN_HELL_DURATION seconds to win; hitting 0 HP
// while this is active fails the quest outright instead of triggering the
// normal Julie/Gloria rescue (see takeDamage).
const PEDESTRIAN_HELL_DURATION = 30;
// Only one motorcycle ever charges at a time — see updateHellAttacker.
// It aims once (at the player's position when the charge starts) and
// drives dead straight at HELL_CHARGE_SPEED; it does not re-aim, so a
// sidestep genuinely dodges it, and once its run ends it just rides off.
const HELL_CHARGE_SPEED = 16;
const HELL_CHARGE_DURATION = 3.5; // give up and ride off after this long
const HELL_ATTACK_COOLDOWN_MIN = 0.2;
const HELL_ATTACK_COOLDOWN_MAX = 0.8; // averages ~0.5s between charges
let pedestrianHellActive = false;
let pedestrianHellStart = 0;
const MAX_HELL_ATTACKERS = 5; // how many can be charging at once
let hellAttackers = []; // [{ m, endTime }]
let hellNextAttackTime = 0;

function startPedestrianHellQuest() {
  hp = 100;
  updateHUD();
  pedestrianHellActive = true;
  pedestrianHellStart = clock.elapsedTime;
  hellAttackers = [];
  hellNextAttackTime = clock.elapsedTime + 1;
  document.getElementById('hellBanner').style.display = 'flex';
}

function updatePedestrianHell() {
  if (!pedestrianHellActive) return;
  const remaining = PEDESTRIAN_HELL_DURATION - (clock.elapsedTime - pedestrianHellStart);
  if (remaining <= 0) {
    endPedestrianHell(true);
    return;
  }
  document.getElementById('hellTimer').textContent = `${Math.ceil(remaining)}s`;
  updateHellAttacker();
}

function updateHellAttacker() {
  if (!character) return;

  // Retire any attacker whose run has ended (timeout or off the map),
  // freeing up a slot for a new one.
  for (let i = hellAttackers.length - 1; i >= 0; i--) {
    const a = hellAttackers[i];
    const outOfBounds = Math.abs(a.m.mesh.position.x) > CITY_SIZE + 20
      || Math.abs(a.m.mesh.position.z) > CITY_SIZE + 20;
    if (clock.elapsedTime >= a.endTime || outOfBounds) {
      a.m.charging = false;
      a.m.chargeDir = null;
      hellAttackers.splice(i, 1);
    }
  }

  if (hellAttackers.length >= MAX_HELL_ATTACKERS) return;
  if (clock.elapsedTime < hellNextAttackTime) return;

  const pool = motorcycles.filter((m) => !m.charging);
  const candidate = pool[Math.floor(Math.random() * pool.length)];
  if (!candidate) return;
  const dx = character.position.x - candidate.mesh.position.x;
  const dz = character.position.z - candidate.mesh.position.z;
  const d = Math.hypot(dx, dz) || 1;
  candidate.charging = true;
  candidate.chargeDir = { x: dx / d, z: dz / d };
  hellAttackers.push({ m: candidate, endTime: clock.elapsedTime + HELL_CHARGE_DURATION });
  hellNextAttackTime = clock.elapsedTime + HELL_ATTACK_COOLDOWN_MIN + Math.random() * (HELL_ATTACK_COOLDOWN_MAX - HELL_ATTACK_COOLDOWN_MIN);
}

function endPedestrianHell(won) {
  pedestrianHellActive = false;
  document.getElementById('hellBanner').style.display = 'none';
  hellAttackers.forEach((a) => { a.m.charging = false; a.m.chargeDir = null; });
  hellAttackers = [];
  hp = 100;
  updateHUD();
  gameState = 'questComplete'; // freezes input until the result dialog is confirmed
  if (won) {
    completeQuest('pedestrianHell');
    showFoundOverlay('🎉 挑戰成功！', '你撐過了 30 秒的行人地獄！', () => {});
  } else {
    showFoundOverlay('💀 任務失敗', '血量歸零了……要再挑戰一次嗎？可以到任務欄重新接受任務。', () => {
      unlockQuest('pedestrianHell');
    });
  }
}

// --- Running out of HP: a full scripted rescue sequence ---
// 1. The player's own line ("我快不行了"). 2. Julie & Gloria's reply,
// heard before they're even visible. 3. They appear near the map boundary
// and walk in, camera tracking them. 4. They reach the player and announce
// the heal. 5. A 10s "治癒中" countdown, full-heals. 6. A parting line.
// 7. A car drives up, they board, and drive off together — control returns
// to the player only then. `isHealingEvent` spans the whole thing, guarding
// takeDamage() from re-triggering mid-sequence. Reuses whichever npc/gloria
// instances already exist regardless of where the 我要報帳 quest chain
// currently has them.
let isHealingEvent = false;

// Tips the player's model onto its side at 0 HP, for the duration of the
// rescue sequence — updateCharacter (which drives the normal idle/walk
// pose) is skipped the whole time anyway, since gameState is never
// 'playing' during any of it, so nothing fights this rotation.
function setLyingDown(lying) {
  if (!model) return;
  model.rotation.x = lying ? -Math.PI / 2 : 0;
}

// Step 0 (before any dialog): camera zooms in tight on the player's face,
// who then slowly collapses onto the ground over the same stretch of time
// — replaces an instant snap to lying down.
const COLLAPSE_DURATION = 1.8;
let collapseState = null;
function runCollapse() {
  return new Promise((resolve) => {
    collapseState = {
      startTime: clock.elapsedTime,
      startCamPos: camera.position.clone(),
      startCamLookAt: character.position.clone().add(new THREE.Vector3(0, 1.4, 0)),
      resolve,
    };
    gameState = 'rescueCollapse';
  });
}
function updateCollapse() {
  if (gameState !== 'rescueCollapse' || !collapseState || !character || !model) return;
  const s = collapseState;
  const t = Math.min(1, (clock.elapsedTime - s.startTime) / COLLAPSE_DURATION);
  const e = easeInOutCubic(t);

  const closeUpPos = getTargetFrontCamPos(character).clone().lerp(character.position, 0.4).add(new THREE.Vector3(0, 0.6, 0));
  const closeUpLookAt = character.position.clone().add(new THREE.Vector3(0, 1.3, 0));
  camera.position.lerpVectors(s.startCamPos, closeUpPos, e);
  const lookAt = new THREE.Vector3().lerpVectors(s.startCamLookAt, closeUpLookAt, e);
  camera.lookAt(lookAt);

  model.rotation.x = -Math.PI / 2 * e;

  if (t >= 1) {
    gameState = 'rescueSequence';
    const resolve = s.resolve;
    collapseState = null;
    resolve();
  }
}

// A flat dialog overlay (no 3D camera cutscene, unlike beginDialogCutscene)
// — the rescue sequence manages gameState/camera itself throughout, so
// this just shows text+portraits and resolves once the player confirms.
// `portraitModel2` shows a second, equally-sized portrait beside the first
// (both speaking together — Julie & Gloria's lines), as opposed to
// beginQuestIntro's small "提示" thumbnail (one character mentioning what
// another looks like). Never both at once.
function showRescueLine(title, text, portraitModel, portraitModel2) {
  return new Promise((resolve) => {
    document.getElementById('questDialogTitle').textContent = title;
    document.getElementById('questDialogText').textContent = text;
    const canvas = document.getElementById('questPortrait');
    if (portraitModel) { canvas.style.display = 'block'; renderPortraitOf(portraitModel, 0.4); }
    else canvas.style.display = 'none';
    const canvas2 = document.getElementById('questPortrait2');
    if (portraitModel2) { canvas2.style.display = 'block'; renderPortraitOf2(portraitModel2, 0.4); }
    else canvas2.style.display = 'none';
    document.getElementById('questHintBox').style.display = 'none';
    document.getElementById('questIntroDialog').style.display = 'block';
    dialogMode = 'rescue';
    pendingConfirm = resolve;
  });
}

// Step 3: Julie & Gloria spawn out past the paved city (roughly where the
// player currently is, projected out toward the tree ring) and walk in,
// camera trailing behind them looking at their midpoint the whole way.
let rescueWalkInState = null;
function runRescueWalkIn() {
  return new Promise((resolve) => {
    const outward = new THREE.Vector3(character.position.x, 0, character.position.z);
    if (outward.lengthSq() < 1) outward.set(Math.sin(character.rotation.y), 0, Math.cos(character.rotation.y));
    outward.normalize();
    const spawnPoint = character.position.clone().addScaledVector(outward, 30);
    // Only x/z — each model's own .y is loadNPC's ground-alignment offset
    // (not necessarily 0; Gloria's statue model needs a sizeable one).
    npc.position.x = spawnPoint.x + 1.2;
    npc.position.z = spawnPoint.z;
    gloria.position.x = spawnPoint.x - 1.2;
    gloria.position.z = spawnPoint.z;
    if (!npc.parent) scene.add(npc);
    if (!gloria.parent) scene.add(gloria);

    rescueWalkInState = {
      startTime: clock.elapsedTime,
      duration: 4.5,
      startNpcPos: npc.position.clone(),
      startGloriaPos: gloria.position.clone(),
      resolve,
    };
    gameState = 'rescueWalkIn';
  });
}

function updateRescueWalkIn() {
  if (gameState !== 'rescueWalkIn' || !rescueWalkInState || !character) return;
  const s = rescueWalkInState;
  const t = Math.min(1, (clock.elapsedTime - s.startTime) / s.duration);
  const e = easeInOutCubic(t);
  const baseAngle = character.rotation.y;
  const dist = 1.6;
  // Keep each model at its own loadNPC ground-alignment y throughout —
  // never lerp toward a literal 0, which isn't Gloria's correct baseline.
  const targetNpc = new THREE.Vector3(
    character.position.x + Math.sin(baseAngle + 0.6) * dist, s.startNpcPos.y,
    character.position.z + Math.cos(baseAngle + 0.6) * dist
  );
  const targetGloria = new THREE.Vector3(
    character.position.x + Math.sin(baseAngle - 0.6) * dist, s.startGloriaPos.y,
    character.position.z + Math.cos(baseAngle - 0.6) * dist
  );
  npc.position.lerpVectors(s.startNpcPos, targetNpc, e);
  gloria.position.lerpVectors(s.startGloriaPos, targetGloria, e);
  const facing = Math.atan2(targetNpc.x - s.startNpcPos.x, targetNpc.z - s.startNpcPos.z);
  npc.rotation.y = facing;
  gloria.rotation.y = facing;

  // Camera trails behind the pair as they approach, always framing their
  // midpoint — "鏡頭跟隨著 Julie 和 Gloria".
  const mid = new THREE.Vector3().addVectors(npc.position, gloria.position).multiplyScalar(0.5);
  const behind = new THREE.Vector3(character.position.x - mid.x, 0, character.position.z - mid.z);
  if (behind.lengthSq() < 0.01) behind.set(0, 0, 1); else behind.normalize();
  const camPos = mid.clone().addScaledVector(behind, -7).add(new THREE.Vector3(0, 3.2, 0));
  camera.position.lerp(camPos, 0.06);
  camera.lookAt(mid.x, 1.4, mid.z);

  if (t >= 1) {
    gameState = 'rescueSequence';
    const resolve = s.resolve;
    rescueWalkInState = null;
    resolve();
  }
}

// Step 5: the 10s "治癒中" countdown, reusing the HP bar's own full-heal.
const HEALING_DURATION = 10;
let healingStart = 0;
let healingResolve = null;
function runHealingCountdown() {
  return new Promise((resolve) => {
    document.getElementById('healingBanner').style.display = 'block';
    healingStart = clock.elapsedTime;
    healingResolve = resolve;
    gameState = 'healing';
  });
}
function updateHealingEvent() {
  if (gameState !== 'healing') return;
  if (clock.elapsedTime - healingStart >= HEALING_DURATION) {
    hp = 100;
    updateHUD();
    document.getElementById('healingBanner').style.display = 'none';
    gameState = 'rescueSequence';
    const resolve = healingResolve;
    healingResolve = null;
    if (resolve) resolve();
  }
}

// Step 7: a car drives in to where Julie & Gloria are standing, they board
// (removed from the scene), then it drives off — reusing the same
// run-off-and-vanish animation as every other NPC exit.
let carDepartureState = null;
function runCarDeparture() {
  return new Promise((resolve) => {
    const midX = (npc.position.x + gloria.position.x) / 2;
    const midZ = (npc.position.z + gloria.position.z) / 2;
    const angle = Math.random() * Math.PI * 2;
    const car = makeCar(0xdedede);
    const startPos = new THREE.Vector3(midX + Math.sin(angle) * 10, 0, midZ + Math.cos(angle) * 10);
    car.position.copy(startPos);
    car.rotation.y = angle + Math.PI;
    scene.add(car);
    carDepartureState = {
      startTime: clock.elapsedTime,
      duration: 1.5,
      car,
      startPos,
      targetPos: new THREE.Vector3(midX, 0, midZ),
      resolve,
      arrived: false,
    };
    gameState = 'rescueCarDeparture';
  });
}

function updateCarDeparture() {
  if (gameState !== 'rescueCarDeparture' || !carDepartureState || carDepartureState.arrived) return;
  const s = carDepartureState;
  const t = Math.min(1, (clock.elapsedTime - s.startTime) / s.duration);
  s.car.position.lerpVectors(s.startPos, s.targetPos, easeInOutCubic(t));
  if (t >= 1) {
    s.arrived = true;
    if (npc.parent) scene.remove(npc);
    if (gloria.parent) scene.remove(gloria);
    startRunAway(s.car, () => {
      carDepartureState = null;
      gameState = 'rescueSequence';
      s.resolve();
    });
  }
}

async function startHealingEvent() {
  if (isHealingEvent) return;
  isHealingEvent = true;
  gameState = 'rescueSequence';
  await runCollapse();
  await Promise.all([npcReady, gloriaReady, characterReady]);
  if (!character) { isHealingEvent = false; gameState = 'playing'; return; }

  await showRescueLine('爹地', '痾…我快不行了…', modelPortraitSource, null);
  await showRescueLine('Julie & Gloria', '讓我來治癒你吧！', npcPortraitSource, gloriaPortraitSource);

  // If Julie/Gloria are currently doing quest-chain duty — most notably
  // Julie standing at her "waiting for the ticket" spot during
  // julliePhase 'awaitReturn' — pulling them over here and later sending
  // them off in the car (below) would otherwise strand that quest with no
  // Julie left anywhere to walk back to. Save whichever of them the quest
  // chain still needs, and put them right back afterward.
  const savedNpc = (npc && npc.parent && julliePhase) ? { pos: npc.position.clone(), rotY: npc.rotation.y } : null;
  const savedGloria = (gloria && gloria.parent && gloriaPhase) ? { pos: gloria.position.clone(), rotY: gloria.rotation.y } : null;

  await runRescueWalkIn();
  await showRescueLine('Julie & Gloria', '開始治癒！！', npcPortraitSource, gloriaPortraitSource);
  await runHealingCountdown();
  await showRescueLine('Julie & Gloria', '下次要注意安全喔！', npcPortraitSource, gloriaPortraitSource);
  await runCarDeparture();

  if (savedNpc) {
    npc.position.copy(savedNpc.pos);
    npc.rotation.y = savedNpc.rotY;
    if (!npc.parent) scene.add(npc);
  }
  if (savedGloria) {
    gloria.position.copy(savedGloria.pos);
    gloria.rotation.y = savedGloria.rotY;
    if (!gloria.parent) scene.add(gloria);
  }

  setLyingDown(false);
  isHealingEvent = false;
  gameState = 'playing';
}

// --- Throwing money (灑錢): a short cutscene — camera swings around to the
// character's face, holds for a beat, the money actually leaves (particles
// + the deduction) with a "爹地好開心" caption, then the camera swings back
// and control returns. Player input is frozen throughout because none of
// the intermediate gameState values here are 'playing', which is what
// updateCharacter (and the traffic-hit/pickup checks) gate on.
const MONEY_CAM_DURATION = 0.6;
const MONEY_HOLD_DURATION = 0.4; // + MONEY_CAM_DURATION = ~1s at the face before the throw
const MONEY_DIALOG_DURATION = 1.0;
let moneyStateStart = 0;

function startThrowMoneySequence() {
  if (!character || gameState !== 'playing') return;
  if (money <= 0) return;
  gameState = 'moneyCamIn';
  moneyStateStart = clock.elapsedTime;
}

function updateMoneyCinematic() {
  if (gameState === 'moneyCamIn') {
    const t = Math.min(1, (clock.elapsedTime - moneyStateStart) / MONEY_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getGameplayCamPos(), getFrontViewCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getGameplayLookAt(), getFrontViewLookAt(), e));
    if (t >= 1) {
      gameState = 'moneyHold';
      moneyStateStart = clock.elapsedTime;
    }
  } else if (gameState === 'moneyHold') {
    camera.position.copy(getFrontViewCamPos());
    camera.lookAt(getFrontViewLookAt());
    if (clock.elapsedTime - moneyStateStart >= MONEY_HOLD_DURATION) {
      throwMoney();
      document.getElementById('moneyDialog').style.display = 'block';
      gameState = 'moneyDialog';
      moneyStateStart = clock.elapsedTime;
    }
  } else if (gameState === 'moneyDialog') {
    camera.position.copy(getFrontViewCamPos());
    camera.lookAt(getFrontViewLookAt());
    if (clock.elapsedTime - moneyStateStart >= MONEY_DIALOG_DURATION) {
      document.getElementById('moneyDialog').style.display = 'none';
      gameState = 'moneyCamOut';
      moneyStateStart = clock.elapsedTime;
    }
  } else if (gameState === 'moneyCamOut') {
    const t = Math.min(1, (clock.elapsedTime - moneyStateStart) / MONEY_CAM_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(getFrontViewCamPos(), getGameplayCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getFrontViewLookAt(), getGameplayLookAt(), e));
    if (t >= 1) {
      gameState = 'playing';
    }
  }
}

// The actual particle burst + deduction, fired partway through the
// cutscene above (see 'moneyHold'). No gameState guard here — the caller
// is responsible for that (startThrowMoneySequence for the player-facing
// entry point).
const THROW_COST = 10;
const moneyParticles = []; // { mesh, velocity, life }
function throwMoney() {
  const amount = Math.min(THROW_COST, money);
  if (amount <= 0) return;
  money -= amount;
  updateHUD();

  const origin = character.position.clone().add(new THREE.Vector3(0, 1.3, 0));
  for (let i = 0; i < 14; i++) {
    const bill = new THREE.Mesh(
      new THREE.PlaneGeometry(0.35, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x3fb552, side: THREE.DoubleSide })
    );
    bill.position.copy(origin);
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.8 + Math.random() * 2.6;
    const velocity = new THREE.Vector3(
      Math.cos(angle) * speed,
      3 + Math.random() * 2.5,
      Math.sin(angle) * speed
    );
    scene.add(bill);
    moneyParticles.push({ mesh: bill, velocity, life: 0 });
  }
}

function updateMoneyParticles(delta) {
  for (let i = moneyParticles.length - 1; i >= 0; i--) {
    const p = moneyParticles[i];
    p.velocity.y -= 9.8 * delta;
    p.mesh.position.addScaledVector(p.velocity, delta);
    p.mesh.rotation.x += delta * 6;
    p.mesh.rotation.y += delta * 4;
    p.life += delta;
    if (p.mesh.position.y < 0.05 || p.life > 1.8) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      moneyParticles.splice(i, 1);
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyF') startThrowMoneySequence();
});

// --- Camera zoom ---
// The gameplay camera is rigidly locked behind the character (see
// updateCharacter's camera step below) — no free mouse-look — so all the
// player can adjust is how far back/high it sits. Scroll wheel scales that
// offset; it never rotates around the character.
let camZoom = 1;
const CAM_ZOOM_MIN = 0.5;
const CAM_ZOOM_MAX = 2.2;
window.addEventListener('wheel', (e) => {
  if (gameState !== 'playing') return;
  camZoom = THREE.MathUtils.clamp(camZoom + Math.sign(e.deltaY) * 0.08, CAM_ZOOM_MIN, CAM_ZOOM_MAX);
}, { passive: true });

// On touch devices, zoom is a dedicated vertical slider (see #zoomSlider)
// instead of a pinch gesture — wired up down in the touch-controls section.

// --- Character ---
// `character` is the root group: it owns world position + facing rotation.
// `model` is the loaded mesh nested inside it: procedural walk-bob/sway/lean
// gets applied only to `model`'s local transform, so it never fights with
// the facing rotation or position logic below.
let character = null;
let model = null;
let modelPortraitSource = null;
let modelBaseY = 0;
let hasSkeletalAnimation = false;
let mixer = null;
let actions = {};
let currentAction = null;
const clock = new THREE.Clock();

// Resolves once `character` exists, so the opening cinematic (which needs a
// character position to fly the camera toward) can wait on it even if the
// player mashes START before the model has finished downloading.
let resolveCharacterReady;
const characterReady = new Promise((resolve) => { resolveCharacterReady = resolve; });

const loadingEl = document.getElementById('loading');
const loader = new GLTFLoader();
loader.load(
  './model/character.glb',
  (gltf) => {
    model = gltf.scene;
    model.traverse((obj) => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    // Normalize scale/position based on bounding box
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const height = size.y || 1;
    const targetHeight = 1.8;
    const scale = targetHeight / height;
    model.scale.setScalar(scale);

    // Recompute box after scale to sit on ground
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;
    modelBaseY = model.position.y;

    character = new THREE.Group();
    character.add(model);
    scene.add(character);

    // A frozen, never-animated clone for portraits (see npcPortraitSource/
    // gloriaPortraitSource) — taken before the idle animation starts below,
    // so the player's own face in the "我快不行了" dialog doesn't depend on
    // where the idle loop happens to be.
    modelPortraitSource = cloneSkinned(model);

    // Animations
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(character);
      gltf.animations.forEach((clip) => {
        actions[clip.name] = mixer.clipAction(clip);
      });
      const names = Object.keys(actions);
      console.log('Available animations:', names);

      // Try to guess idle/walk/run clips by name, else fallback to first clips
      const findByKeyword = (kw) => names.find(n => n.toLowerCase().includes(kw));
      actions.idleName = findByKeyword('idle') || names[0];
      actions.walkName = findByKeyword('walk') || names[Math.min(1, names.length - 1)];
      actions.runName = findByKeyword('run') || actions.walkName;

      playAction(actions.idleName);
      hasSkeletalAnimation = true;
    }

    loadingEl.style.display = 'none';
    resolveCharacterReady();
  },
  (xhr) => {
    if (xhr.total) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      loadingEl.textContent = `載入模型中... ${pct}%`;
    }
  },
  (err) => {
    console.error('Failed to load model', err);
    loadingEl.textContent = '模型載入失敗，請查看主控台';
  }
);

function playAction(name, fade = 0.2) {
  if (!name || !actions[name] || !(actions[name] instanceof THREE.AnimationAction)) return;
  const next = actions[name];
  if (currentAction === next) return;
  next.reset().fadeIn(fade).play();
  if (currentAction) currentAction.fadeOut(fade);
  currentAction = next;
}

// --- Input ---
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.code] = true; });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// --- Touch controls (phones/tablets) ---
// The on-screen buttons just set/clear the same `keys` entries the keyboard
// listeners use, so updateCharacter() doesn't need to know or care which
// input method is driving it.
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function bindHoldButton(id, code) {
  const el = document.getElementById(id);
  const press = (e) => { e.preventDefault(); keys[code] = true; };
  const release = (e) => { e.preventDefault(); keys[code] = false; };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindHoldButton('mcRun', 'ShiftLeft');

// Virtual joystick for movement: dragging the knob sets the same
// forward/back/turn `keys` entries the keyboard uses, based on which
// quadrant of the base the knob is pulled toward. A dead zone near the
// center keeps small jitters from the player's thumb from as being read as
// input.
(function setupJoystick() {
  const base = document.getElementById('joystickBase');
  const knob = document.getElementById('joystickKnob');
  const maxRadius = 45; // px the knob can travel from center
  const deadZone = 0.3; // fraction of maxRadius before a direction "activates"
  let activePointerId = null;

  function clearMoveKeys() {
    keys['KeyW'] = false;
    keys['KeyS'] = false;
    keys['KeyA'] = false;
    keys['KeyD'] = false;
  }

  function updateFromPointer(clientX, clientY) {
    const rect = base.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, maxRadius);
    if (dist > 0) {
      dx = (dx / dist) * clamped;
      dy = (dy / dist) * clamped;
    }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;

    const nx = dx / maxRadius, ny = dy / maxRadius; // normalized -1..1
    keys['KeyW'] = ny < -deadZone;
    keys['KeyS'] = ny > deadZone;
    keys['KeyA'] = nx < -deadZone;
    keys['KeyD'] = nx > deadZone;
  }

  function reset() {
    activePointerId = null;
    knob.style.transform = 'translate(0px, 0px)';
    clearMoveKeys();
  }

  base.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    activePointerId = e.pointerId;
    updateFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId) return;
    e.preventDefault();
    updateFromPointer(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    reset();
  });
  window.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== activePointerId) return;
    reset();
  });
})();
document.getElementById('mcThrow').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  startThrowMoneySequence();
});

// Dedicated vertical zoom slider for touch, replacing pinch-to-zoom — same
// camZoom variable the desktop scroll wheel drives.
document.getElementById('zoomSlider').addEventListener('input', (e) => {
  camZoom = parseFloat(e.target.value);
});

// Help panel: a "？" button toggles a small popup with the controls
// (its text is filled in once gameplay starts — see updateCinematicCamera's
// 'transitioning' branch — since it depends on whether this is a touch
// device or not).
document.getElementById('helpBtn').addEventListener('click', () => {
  const panel = document.getElementById('helpPanel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
});

let walkCycle = 0;

// Procedural fake-walk for models with no skeleton/animation: bobs, sways
// and leans the whole mesh in a stepping rhythm so it doesn't look like it's
// gliding, since there's no rig to animate individual limbs.
function applyProceduralWalk(delta, isMoving, running) {
  if (!model || hasSkeletalAnimation) return;

  const cycleSpeed = running ? 10 : 6;
  const bobHeight = running ? 0.12 : 0.07;
  const swayAmount = running ? 0.09 : 0.05;
  const leanAmount = running ? 0.18 : 0.08;

  if (isMoving) {
    walkCycle += delta * cycleSpeed;
  } else {
    // ease back to neutral pose
    walkCycle += (Math.round(walkCycle / Math.PI) * Math.PI - walkCycle) * Math.min(1, delta * 6);
  }

  const bounce = isMoving ? Math.abs(Math.sin(walkCycle)) * bobHeight : 0;
  const sway = isMoving ? Math.sin(walkCycle) * swayAmount : 0;

  model.position.y = modelBaseY + bounce;
  model.rotation.z = sway;
  const targetLean = isMoving ? THREE.MathUtils.degToRad(leanAmount * 10) : 0;
  model.rotation.x = THREE.MathUtils.lerp(model.rotation.x, targetLean, Math.min(1, delta * 8));
}

const PLAYER_RADIUS = 0.35;

// Moves the character by (dx, dz), sliding along building walls instead of
// stopping dead: each axis is tested and applied independently against the
// AABB colliders pushed by placeBuilding().
function tryMove(dx, dz) {
  const p = character.position;
  const collides = (x, z) => colliders.some(c =>
    x + PLAYER_RADIUS > c.minX && x - PLAYER_RADIUS < c.maxX &&
    z + PLAYER_RADIUS > c.minZ && z - PLAYER_RADIUS < c.maxZ
  );
  if (!collides(p.x + dx, p.z)) p.x += dx;
  if (!collides(p.x, p.z + dz)) p.z += dz;
}

// Knockback ignores colliders mid-flight (see updateCharacter), so a car
// hit can land the player inside a parked car's box — where tryMove's
// per-axis check alone can't dig them back out, since almost any small
// step still overlaps the same box. Called once on landing: nudges the
// position out along whichever axis needs the smaller push, repeating in
// case it landed in the overlap of two colliders.
function resolveCollisionPush(pos) {
  for (let iter = 0; iter < 8; iter++) {
    const hit = colliders.find((c) =>
      pos.x + PLAYER_RADIUS > c.minX && pos.x - PLAYER_RADIUS < c.maxX &&
      pos.z + PLAYER_RADIUS > c.minZ && pos.z - PLAYER_RADIUS < c.maxZ
    );
    if (!hit) return;
    const centerX = (hit.minX + hit.maxX) / 2;
    const centerZ = (hit.minZ + hit.maxZ) / 2;
    const overlapX = (hit.maxX - hit.minX) / 2 + PLAYER_RADIUS - Math.abs(pos.x - centerX);
    const overlapZ = (hit.maxZ - hit.minZ) / 2 + PLAYER_RADIUS - Math.abs(pos.z - centerZ);
    if (overlapX < overlapZ) {
      pos.x += Math.sign(pos.x - centerX || 1) * (overlapX + 0.05);
    } else {
      pos.z += Math.sign(pos.z - centerZ || 1) * (overlapZ + 0.05);
    }
  }
}

// The sidewalk sits `sidewalkThickness` above the road like a real curb.
// Returns how high the ground is under (x, z) so the character can step up
// onto it instead of being visually buried up to the ankles. Matches the
// L-shaped sidewalk strips built in buildCity: a thin band hugging each
// street, not a full quadrant square.
function groundHeightAt(x, z) {
  const inHorizontalStrip = Math.abs(z) > STREET_HALF_WIDTH && Math.abs(z) < STREET_HALF_WIDTH + SIDEWALK_DEPTH;
  const inVerticalStrip = Math.abs(x) > STREET_HALF_WIDTH && Math.abs(x) < STREET_HALF_WIDTH + SIDEWALK_DEPTH;
  const onSidewalk = inHorizontalStrip || inVerticalStrip;
  return onSidewalk ? sidewalkThickness : 0;
}

function updateCharacter(delta) {
  if (!character || gameState !== 'playing') return;

  if (knockbackTimer > 0) {
    // Flying through the air from a car hit: position and the model's tilt
    // are driven entirely by the knockback arc, ignoring WASD until it
    // finishes and the character lands.
    knockbackTimer = Math.max(0, knockbackTimer - delta);
    const t = 1 - knockbackTimer / KNOCKBACK_DURATION;
    const eased = 1 - Math.pow(1 - t, 2); // ease-out: fast launch, slowing before landing
    character.position.x = knockbackStartPos.x + knockbackDir.x * KNOCKBACK_DIST * eased;
    character.position.z = knockbackStartPos.z + knockbackDir.z * KNOCKBACK_DIST * eased;
    character.position.y = knockbackStartPos.y + Math.sin(Math.min(1, t) * Math.PI) * KNOCKBACK_HEIGHT;
    if (model) model.rotateOnAxis(knockbackSpinAxis, knockbackSpinSpeed * delta);

    if (knockbackTimer === 0) {
      // Landed — clear the tumble so it doesn't stay mid-spin into the idle
      // pose, and make sure the landing spot isn't inside a parked car
      // (the knockback arc itself ignores colliders, so it can fling the
      // player straight into one).
      if (model) {
        model.rotation.set(0, 0, 0);
        model.position.y = modelBaseY;
      }
      resolveCollisionPush(character.position);
    }
  } else {
    const walkSpeed = 2.5;
    const runSpeed = 8.5;
    const turnSpeed = 3; // radians/sec, tank-style A/D turning

    const forwardHeld = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
    const backHeld = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
    const turnLeftHeld = (keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0;
    const turnRightHeld = (keys['KeyD'] || keys['ArrowRight']) ? 1 : 0;
    const running = keys['ShiftLeft'] || keys['ShiftRight'];

    // Tank-style controls: A/D turn the character in place, W/S move along
    // however it's currently facing. This sidesteps the strafe-relative-to-
    // its-own-facing scheme tried earlier — turning the character to face its
    // resultant strafe direction while that direction is itself defined
    // relative to the character's current facing is a moving target (the
    // "target" heading is always 90° away from wherever the character
    // currently is), so it never converges and just spins in place forever.
    // Turning explicitly via A/D has no such feedback loop.
    const turnInput = turnRightHeld - turnLeftHeld;
    if (turnInput !== 0) {
      character.rotation.y -= turnInput * turnSpeed * delta;
    }

    const moveInput = forwardHeld - backHeld;
    const isMoving = moveInput !== 0;

    if (isMoving) {
      const facingAngle = character.rotation.y;
      const forward = new THREE.Vector3(Math.sin(facingAngle), 0, Math.cos(facingAngle));

      const speed = running ? runSpeed : walkSpeed;
      tryMove(forward.x * moveInput * speed * delta, forward.z * moveInput * speed * delta);

      if (actions.walkName) {
        playAction(running ? actions.runName : actions.walkName);
      }
    } else {
      if (actions.idleName) playAction(actions.idleName);
    }

    // Step the character up onto the raised sidewalk curb (or back down onto
    // the road) instead of leaving it sunk to its ankles in the pavement.
    const targetGroundY = groundHeightAt(character.position.x, character.position.z);
    character.position.y = THREE.MathUtils.lerp(character.position.y, targetGroundY, Math.min(1, delta * 12));

    applyProceduralWalk(delta, isMoving, running);
  }

  // Camera stays rigidly behind the character: the offset is defined in the
  // character's own local space (0, height, distance) and rotated by its
  // current facing, so turning left/right (via movement, above) swings the
  // camera around with it instead of leaving it to free mouse-look. Only
  // camZoom (scroll wheel) scales how far back/up it sits.
  // Base offset is (0, height, -distance): with rotation.y = 0 the character
  // faces +Z (its rest pose), so -Z is directly behind it.
  const behindOffset = new THREE.Vector3(0, 3, -6).multiplyScalar(camZoom)
    .applyAxisAngle(new THREE.Vector3(0, 1, 0), character.rotation.y);
  const desiredCamPos = character.position.clone().add(behindOffset);
  camera.position.lerp(desiredCamPos, Math.min(1, delta * 8));
  camera.lookAt(character.position.clone().add(new THREE.Vector3(0, 1.4, 0)));
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Opening cinematic: START button -> top-down-to-face camera fly-in ->
// confirm dialog -> normal gameplay camera. `gameState` gates both input
// (updateCharacter only runs once 'playing') and which camera code drives
// the camera each frame, so the scripted cinematic and OrbitControls never
// fight over camera.position in the same frame.
let gameState = 'start'; // 'start' | 'intro' | 'dialog' | 'transitioning' | 'playing'
const topDownCamPos = camera.position.clone(); // (0, 260, 0.01), set above
const topDownLookAt = new THREE.Vector3(0, 0, 0);
const INTRO_DURATION = 3.2;
const TRANSITION_DURATION = 0.7;
let introStart = 0;
let transitionStart = 0;

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// The character's rest pose (rotation.y = 0, before any movement has turned
// it) faces +Z, so "front view" — looking at its face — puts the camera on
// the +Z side looking back toward -Z.
function getFrontViewCamPos() { return character.position.clone().add(new THREE.Vector3(0, 1.6, 3.2)); }
function getFrontViewLookAt() { return character.position.clone().add(new THREE.Vector3(0, 1.5, 0)); }
function getGameplayCamPos() { return character.position.clone().add(new THREE.Vector3(0, 3, -6)); }
function getGameplayLookAt() { return character.position.clone().add(new THREE.Vector3(0, 1.4, 0)); }

function updateCinematicCamera() {
  if (gameState === 'intro') {
    const t = Math.min(1, (clock.elapsedTime - introStart) / INTRO_DURATION);
    const e = easeInOutCubic(t);
    camera.position.lerpVectors(topDownCamPos, getFrontViewCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(topDownLookAt, getFrontViewLookAt(), e));
    if (t >= 1) {
      gameState = 'dialog';
      document.getElementById('dialogBox').style.display = 'block';
    }
  } else if (gameState === 'transitioning') {
    const t = Math.min(1, (clock.elapsedTime - transitionStart) / TRANSITION_DURATION);
    const e = easeInOutCubic(t);
    const endLookAt = getGameplayLookAt();
    camera.position.lerpVectors(getFrontViewCamPos(), getGameplayCamPos(), e);
    camera.lookAt(new THREE.Vector3().lerpVectors(getFrontViewLookAt(), endLookAt, e));
    if (t >= 1) {
      gameState = 'playing';
      document.getElementById('questPanel').style.display = 'block';
      document.getElementById('topRightBar').style.display = 'flex';
      renderQuestPanel();
      updateHUD();
      document.getElementById('helpPanel').innerHTML = isTouchDevice
        ? '左下角搖桿：移動、轉向<br/>右側拉桿：縮放鏡頭<br/>右下角按鈕：跑步、灑錢'
        : 'W / S：前進、後退<br/>A / D：左轉、右轉<br/>Shift：跑步<br/>F：灑錢<br/>滾輪：縮放';
      if (isTouchDevice) {
        document.getElementById('mobileControls').style.display = 'block';
      }
    }
  }
}

window.__dbg = { movingCars, quests };
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = '載入中...';
  await characterReady;
  document.getElementById('startScreen').style.display = 'none';
  introStart = clock.elapsedTime;
  gameState = 'intro';
});

document.getElementById('dialogConfirm').addEventListener('click', () => {
  document.getElementById('dialogBox').style.display = 'none';
  transitionStart = clock.elapsedTime;
  gameState = 'transitioning';
});

// Just dismisses the "found" card and hands control back — the quest stays
// marked completed in the panel, nothing about the run resets. May also
// kick off the next step in a quest chain (see showFoundOverlay callers).
document.getElementById('foundConfirm').addEventListener('click', () => {
  document.getElementById('foundOverlay').style.display = 'none';
  gameState = 'playing';
  const cb = foundOverlayOnConfirm;
  foundOverlayOnConfirm = null;
  if (cb) cb();
});

document.getElementById('questDialogConfirm').addEventListener('click', () => {
  document.getElementById('questIntroDialog').style.display = 'none';
  if (dialogMode === 'rescue') {
    // The rescue sequence manages its own gameState/camera throughout —
    // this dialog is a flat overlay, not a 3D camera cutscene, so there's
    // no cam-out swing back to gameplay to trigger here.
    const cb = pendingConfirm;
    pendingConfirm = null;
    if (cb) cb();
    return;
  }
  if (dialogMode === 'accept') {
    const id = pendingQuestId;
    pendingQuestId = null;
    if (id) acceptQuest(id);
  } else if (dialogMode === 'story') {
    const cb = pendingConfirm;
    pendingConfirm = null;
    if (cb) cb();
  }
  cutsceneStart = clock.elapsedTime;
  gameState = 'dialogCamOut';
});

// --- Animate loop ---
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  updateCharacter(delta);
  updateCinematicCamera();
  updateMoneyCinematic();
  updateDialogCinematic();
  updateHealingEvent();
  updateCollapse();
  updateRescueWalkIn();
  updateCarDeparture();
  if (mixer) mixer.update(delta);
  npcMixers.forEach((m) => m.update(delta));
  updateTraffic(delta);
  updateMotorcycles(delta);
  updatePedestrians(delta);
  updateBeasts(delta);
  updateMoneyParticles(delta);
  updateRunningAwayNpcs(delta);
  if (gameState === 'playing') {
    checkQuestProgress();
    updateTrafficCollisions();
    updatePickups(delta);
    updateQuestArrow();
    updatePedestrianHell();
  } else {
    document.getElementById('questArrow').style.display = 'none';
  }

  renderer.render(scene, camera);
}
animate();
</script>
